/* =========================================================
   ガチャ用リール
========================================================= */

const reel1 = [
    "門","竹","鎌","柏","河","櫻","浜","二"
];

const reel2 = [
    "林","内","田","綾","村","井","宮","田"
];

const reel3 = [
    "有","な","彩","菜","果","穂","萌","伶"
];

const reel4 = [
    "羽","な","樺","歩","夏","帆","寧"
];

const reel5 = [

];



/* =========================================================
   現在の状態
========================================================= */

let counts = {};

let history = [];

let lastWinner = "";

let lastWinTime = "";

let lastHitTimestamps = {};


members.forEach(member => {

    counts[member] = 0;

});



/* =========================================================
   Firebaseから既存データを読み込む
========================================================= */

stateRef.on(

    "value",

    snapshot => {

        const data =
            snapshot.val() || {};


        /*
         * ★重要
         *
         * 既存のFirebaseデータをそのまま読む。
         *
         * これによって過去の履歴を
         * 消さない。
         */

        if (data.counts) {

            counts =
                data.counts;

        }


        if (data.history) {

            history =
                Array.isArray(data.history)
                ? data.history
                : Object.values(data.history);

        }


        if (data.lastWinner) {

            lastWinner =
                data.lastWinner;

        }


        if (data.lastWinTime) {

            lastWinTime =
                data.lastWinTime;

        }


        if (data.lastHitTimestamps) {

            lastHitTimestamps =
                data.lastHitTimestamps;

        }


        /*
         * 存在しないメンバーは0回
         */

        members.forEach(member => {

            if (
                counts[member] === undefined
            ) {

                counts[member] = 0;

            }

        });


        /*
         * 当たりが存在する場合
         * 次の当たりまで表示
         */

        if (
            lastWinner &&
            members.includes(lastWinner)
        ) {

            showWinnerDisplay(
                lastWinner,
                lastWinTime
            );

        }


        render();

        updateRarestDisplay(
            Date.now()
        );


        /*
         * ハズレ表示
         */

        updateMissDisplay();


        /*
         * 接続表示
         */

        document.getElementById(
            "live-spinning"
        ).style.borderColor =
            "#666";

    },


    error => {

        console.error(
            "Firebase接続エラー:",
            error
        );

        document.getElementById(
            "live-spinning"
        ).innerText =
            "Firebase接続エラー";

    }

);



/* =========================================================
   時計
========================================================= */

function updateClock() {

    const now =
        new Date();


    const y =
        now.getFullYear();


    const m =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");


    const d =
        String(
            now.getDate()
        ).padStart(2,"0");

        "火",
        "水",
        "木",
        "金",
        "土"
    ];

        "date-display"
    ).innerText =

        `${y}年${m}月${d}日 (${week[now.getDay()]})`;


    /*
     * 誕生日
     */

    const birthdayMember =
        members.find(member => {

            const birthday =
                memberBirthdays[member];

            return birthday &&
                birthday.month === now.getMonth()+1 &&
                birthday.day === now.getDate();

        });


    if (birthdayMember) {

        document.getElementById(
            "date-display"
        ).innerHTML =

            `${y}年${m}月${d}日 (${week[now.getDay()]})　
             <span style="
                color:#ff4081;
                font-weight:bold;">
                🎂 Happy Birthday ${birthdayMember}
             </span>`;

    }


    const hh =
        String(
            now.getHours()
        ).padStart(2,"0");


    const mm =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const ss =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    document.getElementById(
        "time-display"
    ).innerText =

        `${hh}:${mm}:${ss}`;


    updateSinceTargetDisplay(
        now.getTime()
    );


    updateRarestDisplay(
        now.getTime()
    );

}


setInterval(
    updateClock,
    1000
);


updateClock();



/* =========================================================
   9月13日カウントダウン
========================================================= */

function updateSinceTargetDisplay(
    currentTimestamp
) {

    const target =
        new Date(
            2026,
            8,
            13,
            0,
            0,
            0
        ).getTime();


    const diff =
        target -
        currentTimestamp;


    const element =
        document.getElementById(
            "since-target-info"
        );


    if (diff <= 0) {

        element.innerText =
            "2026年9月13日を迎えました！";

        return;

    }


    const totalSeconds =
        Math.floor(
            diff / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400)
            / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600)
            / 60
        );


    const seconds =
        totalSeconds % 60;


    element.innerHTML =

        `<span style="color:#ff4081">
            ${days}日
         </span>
         ${hours}時間
         ${minutes}分
         ${seconds}秒`;

}



/* =========================================================
   最も出ていないメンバー
========================================================= */

function updateRarestDisplay(
    currentTimestamp
) {

    let rarest = null;

    let oldest = Infinity;


    members.forEach(member => {

        let timestamp =
            lastHitTimestamps[member];


        if (
            timestamp === undefined ||
            timestamp === null
        ) {

            timestamp = 0;

        }


        if (
            timestamp < oldest
        ) {

            oldest =
                timestamp;

            rarest =
                member;

        }

    });


    const element =
        document.getElementById(
            "rarest-info"
        );


    if (!rarest) {

        element.innerText =
            "データなし";

        return;

    }


    if (oldest === 0) {

        element.innerHTML =

            `<span style="
                color:${memberColors[rarest]}">
                ${rarest}
             </span>
             （まだ一度も出ていません）`;

        return;

    }


    let diff =
        currentTimestamp -
        oldest;


    if (diff < 0)
        diff = 0;


    const totalSeconds =
        Math.floor(
            diff / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400)
            / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600)
            / 60
        );


    const seconds =
        totalSeconds % 60;


    let text = "";


    if (days > 0)
        text += `${days}日`;


    if (
        days > 0 ||
        hours > 0
    )
        text += `${hours}時間`;


    if (
        days > 0 ||
        hours > 0 ||
        minutes > 0
    )
        text += `${minutes}分`;


    text += `${seconds}秒`;


    element.innerHTML =

        `<span style="
            color:${memberColors[rarest]}">
            ${rarest}
         </span>
         ―― 最後に当たってから
         <span style="color:#ff4081">
            ${text}
         </span>
         ぶり`;

}



/* =========================================================
   同期乱数
========================================================= */

function seededRandom(seed) {

    const x =
        Math.sin(seed) *
        10000;

    return x -
        Math.floor(x);

}



/* =========================================================
   10秒単位の共通ハズレ
========================================================= */

function getSynchronizedMissName() {

    const block =
        Math.floor(
            Date.now() / 10000
        );


    const r1 =
        seededRandom(
            block + 111
        );


    const r2 =
        seededRandom(
            block + 222
        );


    const r3 =
        seededRandom(
            block + 333
        );


    const r4 =
        seededRandom(
            block + 444
        );


    const r5 =
        seededRandom(
            block + 555
        );


    const lengthRandom =
        seededRandom(
            block + 999
        );


    let length;


    if (
        lengthRandom < 1/8
    ) {

        length = 3;

    }

    else if (
        lengthRandom < 7/8
    ) {

        length = 4;

    }

    else {

        length = 5;

    }


    let name = "";


    name +=
        reel1[
            Math.floor(
                r1 *
                reel1.length
            )
        ];


    name +=
        reel2[
            Math.floor(
                r2 *
                reel2.length
            )
        ];


    name +=
        reel3[
            Math.floor(
                r3 *
                reel3.length
            )
        ];


    if (length >= 4) {

        name +=
            reel4[
                Math.floor(
                    r4 *
                    reel4.length
                )
            ];

    }


    if (length === 5) {

        name +=
            reel5[
                Math.floor(
                    r5 *
                    reel5.length
                )
            ];

    }


    return name;

}



/* =========================================================

function updateMissDisplay() {

/* =========================================================
   ガチャ結果生成
========================================================= */

/*
 * 10秒ごとに1回だけ
 * ガチャを進める。
 *
 * Firebase transactionを使って
 * 「その10秒区間を処理する端末」を
 * 1台だけにする。
 */

function processGacha() {

    const block =
        Math.floor(
            Date.now() / 10000
        );


    const processedRef =
        stateRef.child(
            "lastProcessedBlock"
        );


    processedRef.transaction(
        current => {

            /*
             * すでにこの10秒を
             * 誰かが処理済みなら何もしない
             */

            if (
                current !== null &&
                current >= block
            ) {

                return;

            }


            /*
             * この端末が処理権を取得
             */

            return block;

        },

        (error, committed) => {

            if (error) {

                console.error(
                    "ガチャ処理エラー:",
                    error
                );

                return;

            }


            /*
             * committed=true の端末だけ
             * 結果を確定する
             */

            if (!committed) {

                return;

            }


            generateGachaResult(
                block
            );

        }

    );

}



/* =========================================================
   ガチャ結果を確定
========================================================= */

function generateGachaResult(
    block
) {

    /*
     * 10秒区間ごとに
     * 全端末共通の乱数
     */

    const random =
        seededRandom(
            block + 123456
        );


    /*
     * ここで当たり確率を決める。
     *
     * 1/8 = 12.5%
     */

    const hit =
        random < 1/8;


    /*
     * ハズレなら
     * Firebaseには履歴を書かない。
     *
     * 画面の小さい回転表示だけ変わる。
     */

    if (!hit) {

        return;

    }


    /*
     * 当たりメンバー決定
     */

    const memberRandom =
        seededRandom(
            block + 789012
        );


    const index =
        Math.floor(
            memberRandom *
            members.length
        );


    const winner =
        members[index];


    const now =
        new Date();


    const hh =
        String(
            now.getHours()
        ).padStart(2,"0");


    const mm =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const ss =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    const timeString =
        `${hh}:${mm}:${ss}`;


    /*
     * 現在のFirebaseデータを取得
     */

    stateRef.once(
        "value",
        snapshot => {

            const data =
                snapshot.val() || {};


            let newCounts =
                data.counts || {};


            let newHistory =
                data.history || [];


            let newHits =
                data.lastHitTimestamps || {};


            /*
             * Object形式でも
             * 配列形式でも対応
             */

            if (
                !Array.isArray(
                    newHistory
                )
            ) {

                newHistory =
                    Object.values(
                        newHistory
                    );

            }


            /*
             * 全メンバーを初期化
             */

            members.forEach(member => {

                if (
                    newCounts[member] === undefined
                ) {

                    newCounts[member] = 0;

                }

            });


            /*
             * 当選回数++
             */

            newCounts[winner]++;


            /*
             * 最終当選時刻
             */

            newHits[winner] =
                Date.now();


            /*
             * 履歴追加
             */

            newHistory.unshift({

                name:
                    winner,

                time:
                    timeString

            });


            /*
             * 50件だけ残す
             */

            if (
                newHistory.length > 50
            ) {

                newHistory =
                    newHistory.slice(
                        0,
                        50
                    );

            }


            /*
             * ★既存のgacha_stateに
             * 上書き保存
             *
             * 別データにはしない。
             */

            stateRef.update({

                counts:
                    newCounts,

                history:
                    newHistory,

                lastWinner:
                    winner,

                lastWinTime:
                    timeString,

                lastHitTimestamps:
                    newHits

            });

        }

    );

}



/* =========================================================
   ガチャ開始
========================================================= */

/*
 * ページを開いた直後にも
 * 1回チェックする
 */

processGacha();


/*
 * 1秒ごとにチェック。
 *
 * 実際にガチャが進むのは10秒区切り。
 *
 * Firebase transactionによって
 * 複数端末から同時に実行されても
 * 同じ10秒区間を二重処理しない。
 */

setInterval(
    processGacha,
    1000
);



/* =========================================================
   当たり表示
========================================================= */

function showWinnerDisplay(
    name,
    timeString
) {

    const display =
        document.getElementById(
            "display"
        );


    display.innerText =
        `🎉 当たり！！【 ${name} 】`;


    display.style.color =
        memberColors[name] ||
        "#ff4081";


    /*
     * 当選時刻
     */

    if (timeString) {

        const timeElement =
            document.getElementById(
                "win-time-display"
            );


        timeElement.innerText =
            `当選時刻: ${timeString}`;


        timeElement.style.display =
            "block";

    }


    /*
     * 公式X
     */

    if (
        memberXUrls[name]
    ) {

        const xLink =
            document.getElementById(
                "x-main-link"
            );


        xLink.href =
            memberXUrls[name];


        xLink.innerText =
            `🔗 ${name} の公式Xを見る ↗`;


        xLink.style.borderColor =
            memberColors[name] ||
            "#e91e63";

    }


    /*
     * シェア
     */

    let elapsedText = "";


    const hitTime =
        lastHitTimestamps[name];


    if (hitTime) {

        let diff =
            Date.now() -
            hitTime;


        if (diff < 0)
            diff = 0;


        const totalSeconds =
            Math.floor(
                diff / 1000
            );


        const days =
            Math.floor(
                totalSeconds / 86400
            );


        const hours =
            Math.floor(
                (totalSeconds % 86400)
                / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600)
                / 60
            );


        const seconds =
            totalSeconds % 60;


        if (days > 0)
            elapsedText +=
                `${days}日`;


        if (
            days > 0 ||
            hours > 0
        )
            elapsedText +=
                `${hours}時間`;


        if (
            days > 0 ||
            hours > 0 ||
            minutes > 0
        )
            elapsedText +=
                `${minutes}分`;


        elapsedText +=
            `${seconds}秒ぶり`;

    }


    let shareText =

        `SUPER☆GiRLS 第7章 ガチャ結果✨\n\n` +

        `🎉 【 ${name} 】が当たりました！`;


    if (elapsedText) {

        shareText +=
            `\n（前回から ${elapsedText}）`;

    }


    shareText +=
        `\n\n#スパガ #SUPERGiRLS`;


    const shareUrl =

        `https://twitter.com/intent/tweet?text=` +

        encodeURIComponent(
            shareText
        );


    document.getElementById(
        "x-share-btn"
    ).href =
        shareUrl;


    document.getElementById(
        "action-btn-container"
    ).style.display =
        "flex";

}



/* =========================================================
   表示更新
========================================================= */

function render() {

    const now =
        new Date();


    const month =
        now.getMonth() + 1;


    const date =
        now.getDate();


    let html = "";


    members.forEach(member => {

        const color =
            memberColors[member] ||
            "#fff";


        const birthday =
            memberBirthdays[member];


        const isBirthday =

            birthday &&

            birthday.month === month &&

            birthday.day === date;


        const birthdayHTML =

            isBirthday

            ?

            `<span class="birthday-tag">
                🎂 Happy Birthday ${member}
             </span>`

            :

            "";


        html += `

            <div class="row">

                <div class="member-info">

                    <span
                        class="member-badge"
                        style="
                            background-color:${color};
                        ">
                    </span>


                    <span
                        class="member-name"
                        style="
                            color:${color};
                        ">

                        ${member}

                    </span>


                    ${birthdayHTML}


                    <a
                        href="${memberXUrls[member]}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="x-sub-link">

                        X ↗

                    </a>

                </div>


                <span class="count-num">

                    ${counts[member] || 0} 回

                </span>

            </div>

        `;

    });


    document.getElementById(
        "list"
    ).innerHTML =
        html;



    /* =========================
       履歴
    ========================= */

    let historyHTML = "";


    if (
        history.length === 0
    ) {

        historyHTML =

            `<div style="
                color:#777;
                text-align:center;
                padding:10px;
            ">
                まだ履歴はありません
             </div>`;

    }

    else {

        history.forEach(item => {

            const color =
                memberColors[item.name] ||
                "#fff";


            historyHTML += `

                <div class="history-row">

                    <div class="history-member">

                        <span
                            class="history-badge"
                            style="
                                background-color:${color};
                            ">
                        </span>


                        <span
                            style="
                                color:${color};
                                font-weight:bold;
                            ">

                            🎉 ${item.name}

                        </span>

                    </div>


                    <span class="history-time">

                        ${item.time}

                    </span>

                </div>

            `;

        });

    }


    document.getElementById(
        "history-list"
    ).innerHTML =
        historyHTML;

}



/* =========================================================
   初期表示
========================================================= */

render();

updateClock();

updateMissDisplay();
