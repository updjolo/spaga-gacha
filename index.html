<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SUPER☆GiRLS 第7章</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #eee;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 20px;
            color: #ddd;
            margin: 0 0 10px 0;
            font-weight: normal;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* 時計エリア */
        #clock-box {
            background: rgba(28, 28, 28, 0.9);
            border: 2px solid #e91e63;
            border-radius: 15px;
            padding: 15px 30px;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
            width: 90%;
            max-width: 500px;
        }
        #date-display {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 5px;
        }
        #time-display {
            font-size: 45px;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        /* 2026年9/13までのカウントダウンボックス */
        #since-target-box {
            background: rgba(30, 144, 255, 0.15);
            border: 1px dashed #1e90ff;
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
            width: 90%;
            max-width: 500px;
            font-size: 14px;
            color: #87cefa;
        }
        #since-target-box span {
            font-weight: bold;
            color: #fff;
        }

        /* 最も出ていないメンバーの表示エリア */
        #rarest-box {
            background: rgba(233, 30, 99, 0.15);
            border: 1px dashed #e91e63;
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
            width: 90%;
            max-width: 500px;
            font-size: 14px;
            color: #ff80ab;
        }
        #rarest-box span {
            font-weight: bold;
            color: #fff;
        }

        /* リアルタイムモニター */
        #live-spinning {
            font-size: 14px;
            color: #bbb;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: inline-block;
            font-family: 'Courier New', monospace;
            border: 1px dashed #777;
        }

        /* 当選ステータスコンテナ */
        #win-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
            min-height: 100px;
            justify-content: center;
        }

        #display {
            font-size: 32px;
            font-weight: bold;
            color: #ff4081;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            letter-spacing: 3px;
            transition: color 0.3s ease;
        }

        /* 当選時刻の表示 */
        #win-time-display {
            font-size: 15px;
            color: #ddd;
            margin-bottom: 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            display: none;
        }

        /* ボタン群コンテナ */
        #action-btn-container {
            flex-direction: column;
            gap: 12px;
            margin: 15px auto;
            width: 90%;
            max-width: 500px;
            display: none;
        }

        .action-btn {
            display: block;
            padding: 12px 24px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            font-size: 15px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.3s;
            box-sizing: border-box;
            text-align: center;
        }
        .action-btn:hover {
            transform: scale(1.03);
        }

        /* 公式Xリンクボタン */
        #x-main-link {
            background-color: #000;
            color: #fff;
            border: 2px solid #e91e63;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
        }

        /* シェアボタン */
        #x-share-btn {
            background-color: #1da1f2;
            color: #fff;
            border: 2px solid #1da1f2;
            box-shadow: 0 4px 15px rgba(29, 161, 242, 0.4);
        }
        #x-share-btn:hover {
            background-color: #0c85d0;
        }

        /* 共通ボックス */
        .box {
            width: 90%;
            max-width: 500px;
            margin: 15px auto;
            background: rgba(28, 28, 28, 0.9);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            border: 1px solid #555;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        .box h3 {
            margin-top: 0;
            font-size: 18px;
            color: #e91e63;
            border-bottom: 2px solid #555;
            padding-bottom: 8px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
            font-size: 16px;
        }
        .row:last-child { border-bottom: none; }
        
        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .member-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(255,255,255,0.3);
        }

        .member-name {
            font-weight: bold;
        }

        .birthday-tag {
            font-size: 11px;
            background: #ff4081;
            color: #fff;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .x-sub-link {
            color: #1da1f2;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #1da1f2;
            padding: 2px 8px;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .x-sub-link:hover {
            background-color: #1da1f2;
            color: #fff;
        }

        .count-num { 
            color: #e91e63; 
            font-weight: bold; 
            font-size: 18px;
        }

        #history-list {
            max-height: 220px;
            overflow-y: auto;
            font-size: 14px;
        }
        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px dashed #444;
            color: #ccc;
        }
        .history-row:last-child { border-bottom: none; }

        .history-member {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .history-time {
            color: #aaa;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>

        <div id="list"></div>

    <div class="box">
        <h3>📜 当選履歴（直近50件）</h3>
        <div id="history-list"></div>
    </div>
