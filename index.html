    <style>

        /* 当選エリア */
        #win-container {
            display: flex;

        /* ハズレ表示 */

        /* ボタン */

        .action-btn {

        /* 共通ボックス */
        .box {

        .box h3 {

        .row {

    <h1>SUPER☆GiRLS 第7章</h1>

    <!-- 時計 -->

        <div id="date-display">

        <span id="live-spinning">
            ガチャ起動中・・・
        </span>
    </div>

    <!-- Firebase接続 -->
    <div id="firebase-status">
        🟡 Firebase接続確認中...
    </div>


    <!-- 当選表示 -->

        <div id="display">

    <!-- 履歴 -->

<script>


/* =========================================================
   Firebase設定
   ========================================================= */

const firebaseConfig = {

    databaseURL:
        "https://spaga-gacha-default-rtdb.firebaseio.com"

};


/* Firebase初期化 */

try {

    firebase.initializeApp(firebaseConfig);

} catch (error) {

    console.error("Firebase初期化エラー:", error);

}


/* Database */

const db = firebase.database();


/*
   ★ここが重要

   v28に変更しているので、
   今までのデータとは別の場所になります。

   → 回数はリセットされた状態でスタートします。
*/

const DATA_PATH = "gacha_state_v28";

const stateRef = db.ref(DATA_PATH);



/* =========================================================
   メンバー
   ========================================================= */

const members = [

    "門林有羽",
    "竹内ななみ",
    "鎌田彩樺",
    "柏綾菜",
    "河村果歩",
    "櫻井穂夏",
    "浜田萌帆",
    "二宮伶寧"

];



/* =========================================================
   メンバーカラー
   ========================================================= */

const memberColors = {

    "浜田萌帆": "#ff69b4",

    "二宮伶寧": "#a3e635",

    "櫻井穂夏": "#22c55e",

    "柏綾菜": "#c084fc",

    "河村果歩": "#e2e8f0",

    "門林有羽": "#38bdf8",

    "竹内ななみ": "#ef4444",

    "鎌田彩樺": "#5c6bc0"

};



/* =========================================================
   公式X
   ========================================================= */

const memberXUrls = {

    "門林有羽":
        "https://x.com/SG4_YUU",

    "竹内ななみ":
        "https://x.com/SG5_nanami",

    "鎌田彩樺":
        "https://x.com/SG6_AYAKA_avex",

    "柏綾菜":
        "https://x.com/SG6_AYANA_avex",

    "河村果歩":
        "https://x.com/SG6_KAHO_avex",

    "櫻井穂夏":
        "https://x.com/SG6_HONOKA_avex",

    "浜田萌帆":
        "https://x.com/SG7_MOYUHO",

    "二宮伶寧":
        "https://x.com/SG7_RUNE"

};



/* =========================================================
   誕生日
   ========================================================= */

const memberBirthdays = {

    "門林有羽": {
        month: 10,
        day: 28
    },

    "竹内ななみ": {
        month: 10,
        day: 2
    },

    "鎌田彩樺": {
        month: 4,
        day: 29
    },

    "柏綾菜": {
        month: 7,
        day: 20
    },

    "河村果歩": {
        month: 6,
        day: 17
    },

    "櫻井穂夏": {
        month: 7,
        day: 6
    },

    "浜田萌帆": {
        month: 10,
        day: 29
    },

    "二宮伶寧": {
        month: 9,
        day: 16
    }

};



/* =========================================================
   リール
   ========================================================= */

const reel1 = [

    "門",
    "竹",
    "鎌",
    "柏",
    "河",
    "櫻",
    "浜",
    "二"

];

const reel2 = [

    "林",
    "内",
    "田",
    "綾",
    "村",
    "井",
    "宮",
    "田"

];

const reel3 = [

    "有",
    "な",
    "彩",
    "菜",
    "果",
    "穂",
    "萌",
    "伶"

];

const reel4 = [

    "羽",
    "な",
    "樺",
    "歩",
    "夏",
    "帆",
    "寧"

];

const reel5 = [

    "み"

];



/* =========================================================
   初期データ
   ========================================================= */

function createInitialState() {

    const counts = {};

    const lastHitTimestamps = {};


    members.forEach(function(member) {

        counts[member] = 0;

        /*
           最初は全員「まだ一度も当たっていない」
        */

        lastHitTimestamps[member] = 0;

    });


    return {

        counts: counts,

        history: [],

        lastHitTimestamps: lastHitTimestamps,

        lastWinner: "",

        lastWinTime: 0,

        lastResult: {

            text: "",

            winner: false,

            name: "",

            timestamp: 0

        },

        lastDrawSlot: -1

    };

}



/* =========================================================
   ランダム文字列
   ========================================================= */

function getRandomLength() {

    const rand = Math.random();


    /*
       3文字：1/8
       4文字：6/8
       5文字：1/8
    */

    if (rand < 1 / 8) {

        return 3;

    }

    else if (rand < 7 / 8) {

        return 4;

    }

    else {

        return 5;

    }

}



/* =========================================================
   ランダムで名前を作る
   ========================================================= */

function generateRandomName() {

    const len = getRandomLength();

    let name = "";


    name += reel1[
        Math.floor(Math.random() * reel1.length)
    ];

    name += reel2[
        Math.floor(Math.random() * reel2.length)
    ];

    name += reel3[
        Math.floor(Math.random() * reel3.length)
    ];


    if (len >= 4) {

        name += reel4[
            Math.floor(Math.random() * reel4.length)
        ];

    }


    if (len === 5) {

        name += reel5[
            Math.floor(Math.random() * reel5.length)
        ];

    }


    return name;

}



/* =========================================================
   時計
   ========================================================= */

function updateClock() {

    const now = new Date();


    const y =
        now.getFullYear();

    const m =
        String(now.getMonth() + 1).padStart(2, "0");

    const d =
        String(now.getDate()).padStart(2, "0");


    const day =
        [
            "日",
            "月",
            "火",
            "水",
            "木",
            "金",
            "土"
        ][now.getDay()];


    let dateText =
        `${y}年${m}月${d}日 (${day})`;


    /*
       誕生日なら日付の横に表示
    */

    const birthdayMember =
        members.find(function(member) {

            const birthday =
                memberBirthdays[member];

            return birthday &&
                birthday.month === now.getMonth() + 1 &&
                birthday.day === now.getDate();

        });


    if (birthdayMember) {

        dateText +=
            `　🎂 Happy Birthday ${birthdayMember}`;

    }


    document.getElementById(
        "date-display"
    ).innerText = dateText;


    const hh =
        String(now.getHours()).padStart(2, "0");

    const mm =
        String(now.getMinutes()).padStart(2, "0");

    const ss =
        String(now.getSeconds()).padStart(2, "0");


    document.getElementById(
        "time-display"
    ).innerText =
        `${hh}:${mm}:${ss}`;


    updateSinceTargetDisplay(
        now.getTime()
    );

    updateRarestDisplay(
        now.getTime()
    );

}



setInterval(updateClock, 1000);

updateClock();



/* =========================================================
   9/13カウントダウン
   ========================================================= */

function updateSinceTargetDisplay(currentTimestamp) {

    const targetTime =
        new Date(
            2026,
            8,
            13,
            0,
            0,
            0
        ).getTime();


    let diffMs =
        targetTime - currentTimestamp;


    const element =
        document.getElementById(
            "since-target-info"
        );


    if (diffMs <= 0) {

        element.innerText =
            "2026年9月13日を迎えました！";

        return;

    }


    const diffSec =
        Math.floor(diffMs / 1000);


    const days =
        Math.floor(
            diffSec / (3600 * 24)
        );


    const hours =
        Math.floor(
            (diffSec % (3600 * 24)) / 3600
        );


    const minutes =
        Math.floor(
            (diffSec % 3600) / 60
        );


    const seconds =
        diffSec % 60;


    element.innerHTML =

        `<span style="color:#ff4081">${days}日</span> ` +
        `${hours}時間 ` +
        `${minutes}分 ` +
        `${seconds}秒`;

}



/* =========================================================
   最も出ていないメンバー
   ========================================================= */

function updateRarestDisplay(currentTimestamp) {

    if (!currentState) {

        return;

    }


    let rarestMember = null;

    let oldestTime = Infinity;


    members.forEach(function(member) {

        let hitTime =
            currentState.lastHitTimestamps &&
            currentState.lastHitTimestamps[member];


        if (
            hitTime === undefined ||
            hitTime === null
        ) {

            hitTime = 0;

        }


        if (hitTime < oldestTime) {

            oldestTime = hitTime;

            rarestMember = member;

        }

    });


    const element =
        document.getElementById(
            "rarest-info"
        );


    if (!rarestMember) {

        element.innerText =
            "データなし";

        return;

    }


    const color =
        memberColors[rarestMember] ||
        "#ffffff";


    /*
       一度も出ていない
    */

    if (oldestTime === 0) {

        element.innerHTML =

            `<span style="color:${color}">` +
            `${rarestMember}` +
            `</span>（まだ一度も出ていません）`;

        return;

    }


    let diffMs =
        currentTimestamp - oldestTime;


    if (diffMs < 0) {

        diffMs = 0;

    }


    const diffSec =
        Math.floor(diffMs / 1000);


    const days =
        Math.floor(
            diffSec / (3600 * 24)
        );


    const hours =
        Math.floor(
            (diffSec % (3600 * 24)) / 3600
        );


    const minutes =
        Math.floor(
            (diffSec % 3600) / 60
        );


    const seconds =
        diffSec % 60;


    let timeStr = "";


    if (days > 0) {

        timeStr +=
            `${days}日`;

    }


    if (
        days > 0 ||
        hours > 0
    ) {

        timeStr +=
            `${hours}時間`;

    }


    if (
        days > 0 ||
        hours > 0 ||
        minutes > 0
    ) {

        timeStr +=
            `${minutes}分`;

    }


    timeStr +=
        `${seconds}秒`;


    element.innerHTML =

        `<span style="color:${color}">` +
        `${rarestMember}` +
        `</span> ―― 最後に当たってから ` +

        `<span style="color:#ff4081">` +
        `${timeStr}` +
        `</span> ぶり`;

}



/* =========================================================
   現在のFirebaseデータ
   ========================================================= */

let currentState =
    createInitialState();



/* =========================================================
   Firebaseの値を受信
   ========================================================= */

/*
   ★ここが今回のエラー修正ポイント

   正しい書き方は

       stateRef.on("value", function(snapshot) {

       });

   です。

   Query.on failed の原因になるような
   on(ref, "value") などの書き方はしていません。
*/

stateRef.on(
    "value",
    function(snapshot) {

        const data =
            snapshot.val();


        if (!data) {

            currentState =
                createInitialState();

            render();

            return;

        }


        currentState = data;


        /*
           欠損データ補完
        */

        if (!currentState.counts) {

            currentState.counts = {};

        }


        if (!currentState.history) {

            currentState.history = [];

        }


        if (!currentState.lastHitTimestamps) {

            currentState.lastHitTimestamps = {};

        }


        members.forEach(function(member) {

            if (
                currentState.counts[member] === undefined
            ) {

                currentState.counts[member] = 0;

            }


            if (
                currentState.lastHitTimestamps[member] === undefined
            ) {

                currentState.lastHitTimestamps[member] = 0;

            }

        });


        /*
           Firebase接続済み
        */

        const status =
            document.getElementById(
                "firebase-status"
            );


        status.innerText =
            "🟢 サーバー接続済み";

        status.classList.add(
            "connected"
        );

        status.classList.remove(
            "disconnected"
        );


        render();


        /*
           最新結果を表示
        */

        if (
            currentState.lastResult &&
            currentState.lastResult.text
        ) {

            showResult(
                currentState.lastResult
            );

        }

    },

    function(error) {

        console.error(
            "Firebase読み込みエラー:",
            error
        );


        const status =
            document.getElementById(
                "firebase-status"
            );


        status.innerText =
            "🔴 Firebase接続エラー";

        status.classList.add(
            "disconnected"
        );

        status.classList.remove(
            "connected"
        );

    }
);



/* =========================================================
   抽選処理
   ========================================================= */

function drawGacha() {

    /*
       10秒単位の番号

       例：

       12:00:00 ～ 12:00:09
       → 同じslot

       12:00:10 ～ 12:00:19
       → 次のslot
    */

    const now =
        Date.now();


    const slot =
        Math.floor(
            now / 10000
        );


    /*
       Firebase transaction

       同時に複数人がアクセスしても、
       同じ10秒枠では1回だけ抽選します。
    */

    stateRef.transaction(

        function(state) {

            /*
               初期状態
            */

            if (!state) {

                state =
                    createInitialState();

            }


            /*
               すでにこの10秒枠で
               抽選済みなら何もしない
            */

            if (
                state.lastDrawSlot !== undefined &&
                state.lastDrawSlot >= slot
            ) {

                return;

            }


            /*
               ランダム結果
            */

            const result =
                generateRandomName();


            const isWinner =
                members.includes(result);


            const timestamp =
                Date.now();


            /*
               抽選結果
            */

            state.lastResult = {

                text: result,

                winner: isWinner,

                name: isWinner
                    ? result
                    : "",

                timestamp: timestamp

            };


            state.lastDrawSlot =
                slot;


            /*
               当たりの場合
            */

            if (isWinner) {

                /*
                   カウンター
                */

                if (!state.counts) {

                    state.counts = {};

                }


                if (
                    state.counts[result] === undefined
                ) {

                    state.counts[result] = 0;

                }


                state.counts[result]++;


                /*
                   最終当選時刻
                */

                if (!state.lastHitTimestamps) {

                    state.lastHitTimestamps = {};

                }


                state.lastHitTimestamps[result] =
                    timestamp;


                state.lastWinner =
                    result;


                state.lastWinTime =
                    timestamp;


                /*
                   履歴
                */

                if (!state.history) {

                    state.history = [];

                }


                state.history.unshift({

                    name: result,

                    timestamp: timestamp

                });


                /*
                   50件まで
                */

                if (
                    state.history.length > 50
                ) {

                    state.history =
                        state.history.slice(0, 50);

                }

            }


            return state;

        },

        function(error, committed, snapshot) {

            if (error) {

                console.error(
                    "抽選エラー:",
                    error
                );

                return;

            }


            if (committed) {

                console.log(
                    "ガチャ結果を確定:",
                    snapshot.val()
                );

            }

        }

    );

}



/* =========================================================
   10秒ごとに抽選
   ========================================================= */

setInterval(

    function() {

        drawGacha();

    },

    10000

);


/*
   ページを開いたときにも
   現在の10秒枠を確認
*/

setTimeout(

    function() {

        drawGacha();

    },

    1000

);



/* =========================================================
   結果表示
   ========================================================= */

function showResult(result) {

    const display =
        document.getElementById(
            "display"
        );


    const missDisplay =
        document.getElementById(
            "miss-display"
        );


    const live =
        document.getElementById(
            "live-spinning"
        );


    /*
       --------------------------------
       当たり
       --------------------------------
    */

    if (result.winner) {

        const name =
            result.name;


        const color =
            memberColors[name] ||
            "#ff4081";


        display.innerText =
            `🎉 当たり！！【 ${name} 】`;


        display.style.color =
            color;


        /*
           ハズレ表示を消す
        */

        missDisplay.innerText =
            "";


        /*
           ガチャ回転表示
        */

        live.innerText =
            `🎰 ガチャ結果: ${name}`;


        /*
           当選時刻
        */

        if (result.timestamp) {

            const date =
                new Date(
                    result.timestamp
                );


            const hh =
                String(
                    date.getHours()
                ).padStart(2, "0");


            const mm =
                String(
                    date.getMinutes()
                ).padStart(2, "0");


            const ss =
                String(
                    date.getSeconds()
                ).padStart(2, "0");


            const timeEl =
                document.getElementById(
                    "win-time-display"
                );


            timeEl.innerText =
                `当選時刻: ${hh}:${mm}:${ss}`;


            timeEl.style.display =
                "block";

        }


        /*
           Xリンク
        */

        if (memberXUrls[name]) {

            const xLink =
                document.getElementById(
                    "x-main-link"
                );


            xLink.href =
                memberXUrls[name];


            xLink.innerText =
                `🔗 ${name} の公式Xを見る ↗`;


            xLink.style.borderColor =
                color;


            xLink.style.boxShadow =
                `0 4px 15px ${color}66`;

        }


        /*
           シェア
        */

        const shareText =
            `SUPER☆GiRLS 第7章 ガチャ結果✨\n\n` +
            `🎉 【 ${name} 】が当たりました！\n\n` +
            `#スパガ #SUPERGiRLS`;


        const shareUrl =
            `https://twitter.com/intent/tweet?text=` +
            encodeURIComponent(
                shareText
            );


        document.getElementById(
            "x-share-btn"
        ).href =
            shareUrl;


        document.getElementById(
            "action-btn-container"
        ).style.display =
            "flex";

    }


    /*
       --------------------------------
       ハズレ
       --------------------------------
    */

    else {

        /*
           大きな「当たり」は
           前回の当選表示を維持。

           その下に小さく
           ハズレ結果を表示。
        */

        missDisplay.innerText =
            `ハズレ：${result.text}`;


        missDisplay.style.color =
            "#aaa";


        /*
           上の小さいガチャ表示も更新
        */

        live.innerText =
            `🎰 ガチャ結果: ${result.text}`;

    }

}



/* =========================================================
   表示を更新
   ========================================================= */

function render() {

    if (!currentState) {

        return;

    }


    const now =
        new Date();


    const currentMonth =
        now.getMonth() + 1;


    const currentDate =
        now.getDate();


    let html = "";


    members.forEach(function(member) {

        const xUrl =
            memberXUrls[member] ||
            "#";


        const color =
            memberColors[member] ||
            "#ffffff";


        const birthday =
            memberBirthdays[member];


        const isBirthday =
            birthday &&
            birthday.month === currentMonth &&
            birthday.day === currentDate;


        const birthdayHtml =
            isBirthday

            ? `<span class="birthday-tag">` +
              `🎂 Happy Birthday ${member}` +
              `</span>`

            : "";


        const count =
            currentState.counts &&
            currentState.counts[member] !== undefined

            ? currentState.counts[member]

            : 0;


        html += `

            <div class="row">

                <div class="member-info">

                    <span
                        class="member-badge"
                        style="background-color:${color};"
                    ></span>


                    <span
                        class="member-name"
                        style="color:${color};"
                    >
                        ${member}
                    </span>


                    ${birthdayHtml}


                    <a
                        href="${xUrl}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="x-sub-link"
                    >
                        X ↗
                    </a>

                </div>


                <span class="count-num">
                    ${count} 回
                </span>

            </div>

        `;

    });


    document.getElementById(
        "list"
    ).innerHTML =
        html;



    /* =====================================================
       履歴
       ===================================================== */

    let historyHtml = "";


    const history =
        currentState.history || [];


    if (history.length === 0) {

        historyHtml = `

            <div
                style="
                    color:#777;
                    text-align:center;
                    padding:10px;
                "
            >
                まだ履歴はありません
            </div>

        `;

    }

    else {

        history.forEach(function(item) {

            const color =
                memberColors[item.name] ||
                "#ffffff";


            let timeText =
                "";


            if (item.timestamp) {

                const date =
                    new Date(
                        item.timestamp
                    );


                const y =
                    date.getFullYear();


                const mo =
                    String(
                        date.getMonth() + 1
                    ).padStart(2, "0");


                const d =
                    String(
                        date.getDate()
                    ).padStart(2, "0");


                const hh =
                    String(
                        date.getHours()
                    ).padStart(2, "0");


                const mm =
                    String(
                        date.getMinutes()
                    ).padStart(2, "0");


                const ss =
                    String(
                        date.getSeconds()
                    ).padStart(2, "0");


                timeText =
                    `${y}/${mo}/${d} ${hh}:${mm}:${ss}`;

            }


            historyHtml += `

                <div class="history-row">

                    <div class="history-member">

                        <span
                            class="history-badge"
                            style="background-color:${color};"
                        ></span>


                        <span
                            style="
                                color:${color};
                                font-weight:bold;
                            "
                        >
                            🎉 ${item.name}
                        </span>

                    </div>


                    <span class="history-time">
                        ${timeText}
                    </span>

                </div>

            `;

        });

    }


    document.getElementById(
        "history-list"
    ).innerHTML =
        historyHtml;


    /*
       最も出ていないメンバーを更新
    */

    updateRarestDisplay(
        Date.now()
    );

}



/* =========================================================
   初期表示
   ========================================================= */

render();


</script>
