        #history-list {

        }

        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px dashed #444;
        }

        .history-member {
            display: flex;
            align-items: center;

        }

        .history-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .history-time {
            color: #aaa;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

</head>

<div class="box">
    <h3>📜 当選履歴（直近50件）</h3>
    <div id="history-list"></div>
</div>


<script>

/* ==================================================
   Firebase設定
================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCurJ0xKJLE-Z9GGEWcN-R3f5aAmX0FWmI",
    authDomain: "spaga-gacha.firebaseapp.com",
    databaseURL: "https://spaga-gacha-default-rtdb.firebaseio.com",
    projectId: "spaga-gacha",
    storageBucket: "spaga-gacha.firebasestorage.app",
    messagingSenderId: "53575541764",
    appId: "1:53575541764:web:128b89f7b7bbd91c4d0151",
    measurementId: "G-J5D2PDVF1Y"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const stateRef = db.ref("gacha_state");


/* ==================================================
   メンバー
================================================== */

const members = [
    "門林有羽",
    "竹内ななみ",
    "鎌田彩樺",
    "柏綾菜",
    "河村果歩",
    "櫻井穂夏",
    "浜田萌帆",
    "二宮伶寧"
];


/* ==================================================
   メンバーカラー
================================================== */

const memberColors = {

    "浜田萌帆": "#ff69b4",

    "二宮伶寧": "#a3e635",

    "櫻井穂夏": "#22c55e",

    "柏綾菜": "#c084fc",

    "河村果歩": "#e2e8f0",

    "門林有羽": "#38bdf8",

    "竹内ななみ": "#ef4444",

    "鎌田彩樺": "#5c6bc0"

};


/* ==================================================
   X
================================================== */

const memberXUrls = {

    "門林有羽": "https://x.com/SG4_YUU",

    "竹内ななみ": "https://x.com/SG5_nanami",

    "鎌田彩樺": "https://x.com/SG6_AYAKA_avex",

    "柏綾菜": "https://x.com/SG6_AYANA_avex",

    "河村果歩": "https://x.com/SG6_KAHO_avex",

    "櫻井穂夏": "https://x.com/SG6_HONOKA_avex",

    "浜田萌帆": "https://x.com/SG7_MOYUHO",

    "二宮伶寧": "https://x.com/SG7_RUNE"

};


/* ==================================================
   誕生日
================================================== */

const memberBirthdays = {

    "門林有羽": { month: 10, day: 28 },

    "竹内ななみ": { month: 10, day: 2 },

    "鎌田彩樺": { month: 4, day: 29 },

    "柏綾菜": { month: 7, day: 20 },

    "河村果歩": { month: 6, day: 17 },

    "櫻井穂夏": { month: 7, day: 6 },

    "浜田萌帆": { month: 10, day: 29 },

    "二宮伶寧": { month: 9, day: 16 }

};


/* ==================================================
   ガチャリール
================================================== */

const reel1 = [
    "門",
    "竹",
    "鎌",
    "柏",
    "河",
    "櫻",
    "浜",
    "二"
];

const reel2 = [
    "林",
    "内",
    "田",
    "綾",
    "村",
    "井",
    "宮",
    "田"
];

const reel3 = [
    "有",
    "な",
    "彩",
    "菜",
    "果",
    "穂",
    "萌",
    "伶"
];

const reel4 = [
    "羽",
    "な",
    "樺",
    "歩",
    "夏",
    "帆",
    "寧"
];

const reel5 = [
    "み"
];


/* ==================================================
   データ
================================================== */

let counts = {};

let history = [];

let lastWinner = "";

let lastWinTime = "";

let lastHitTimestamps = {};


members.forEach(name => {

    counts[name] = 0;

});


/* ==================================================
   Firebase同期
================================================== */

stateRef.on("value", snapshot => {

    const data = snapshot.val();

    if (data) {

        counts = data.counts || {};

        history = data.history || [];

        lastWinner = data.lastWinner || "";

        lastWinTime = data.lastWinTime || "";

        lastHitTimestamps =
            data.lastHitTimestamps || {};

    }


    members.forEach(name => {

        if (counts[name] === undefined) {

            counts[name] = 0;

        }

    });


    document.getElementById(
        "live-spinning"
    ).innerText = "サーバー接続済み";


    render();

    if (
        lastWinner &&
        members.includes(lastWinner)
    ) {

        showWinnerDisplay(
            lastWinner,
            lastWinTime
        );

    }

});


/* ==================================================
   時計
================================================== */

function updateClock() {

    const now = new Date();

    const y = now.getFullYear();

    const m =
        String(now.getMonth() + 1)
        .padStart(2, "0");

    const d =
        String(now.getDate())
        .padStart(2, "0");

    const day =
        ["日","月","火","水","木","金","土"]
        [now.getDay()];


    document.getElementById(
        "date-display"
    ).innerText =
        `${y}年${m}月${d}日 (${day})`;


    const hh =
        String(now.getHours())
        .padStart(2, "0");

    const mm =
        String(now.getMinutes())
        .padStart(2, "0");

    const ss =
        String(now.getSeconds())
        .padStart(2, "0");


    document.getElementById(
        "time-display"
    ).innerText =
        `${hh}:${mm}:${ss}`;


    updateSinceTargetDisplay(
        now.getTime()
    );

    updateRarestDisplay(
        now.getTime()
    );

}


setInterval(
    updateClock,
    1000
);

updateClock();


/* ==================================================
   9/13カウントダウン
================================================== */

function updateSinceTargetDisplay(now) {

    const target =
        new Date(
            2026,
            8,
            13,
            0,
            0,
            0
        ).getTime();


    let diff =
        target - now;


    const el =
        document.getElementById(
            "since-target-info"
        );


    if (diff <= 0) {

        el.innerText =
            "2026年9月13日を迎えました！";

        return;

    }


    const sec =
        Math.floor(diff / 1000);


    const days =
        Math.floor(
            sec / 86400
        );


    const hours =
        Math.floor(
            (sec % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (sec % 3600) / 60
        );


    const seconds =
        sec % 60;


    el.innerHTML =
        `<span style="color:#ff4081">
        ${days}日
        </span>
        ${hours}時間
        ${minutes}分
        ${seconds}秒`;

}


/* ==================================================
   最も出ていないメンバー
================================================== */

function updateRarestDisplay(now) {

    let rarest = null;

    let oldest = Infinity;


    members.forEach(name => {

        let time =
            lastHitTimestamps[name];


        if (time === undefined) {

            time = 0;

        }


        if (time < oldest) {

            oldest = time;

            rarest = name;

        }

    });


    const el =
        document.getElementById(
            "rarest-info"
        );


    if (!rarest) {

        el.innerText =
            "データなし";

        return;

    }


    if (oldest === 0) {

        el.innerHTML =
            `<span style="color:${memberColors[rarest]}">
            ${rarest}
            </span>
            （まだ一度も出ていません）`;

        return;

    }


    let diff =
        now - oldest;


    if (diff < 0) {

        diff = 0;

    }


    const sec =
        Math.floor(diff / 1000);


    const days =
        Math.floor(sec / 86400);


    const hours =
        Math.floor(
            (sec % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (sec % 3600) / 60
        );


    const seconds =
        sec % 60;


    let text = "";


    if (days > 0) {

        text += `${days}日`;

    }


    if (
        days > 0 ||
        hours > 0
    ) {

        text += `${hours}時間`;

    }


    if (
        days > 0 ||
        hours > 0 ||
        minutes > 0
    ) {

        text += `${minutes}分`;

    }


    text += `${seconds}秒`;


    el.innerHTML =
        `<span style="color:${memberColors[rarest]}">
        ${rarest}
        </span>
        ―― 最後に当たってから
        <span style="color:#ff4081">
        ${text}
        </span>
        ぶり`;

}


/* ==================================================
   ランダムな名前
================================================== */

function getRandomLength() {

    const r =
        Math.random();


    if (r < 1 / 8) {

        return 3;

    }


    if (r < 7 / 8) {

        return 4;

    }


    return 5;

}


function createRandomName() {

    const length =
        getRandomLength();


    let name = "";


    name +=
        reel1[
            Math.floor(
                Math.random() *
                reel1.length
            )
        ];


    name +=
        reel2[
            Math.floor(
                Math.random() *
                reel2.length
            )
        ];


    name +=
        reel3[
            Math.floor(
                Math.random() *
                reel3.length
            )
        ];


    if (length >= 4) {

        name +=
            reel4[
                Math.floor(
                    Math.random() *
                    reel4.length
                )
            ];

    }


    if (length === 5) {

        name +=
            reel5[
                Math.floor(
                    Math.random() *
                    reel5.length
                )
            ];

    }


    return name;

}


/* ==================================================
   ガチャ
================================================== */

function loop() {

    const name =
        createRandomName();


    /* ハズレも必ず表示 */

    document.getElementById(
        "live-spinning"
    ).innerText =
        `ガチャ回転中: ${name}`;


    /* 当たりの場合 */

    if (!members.includes(name)) {

        return;

    }


    const now =
        new Date();


    const hh =
        String(now.getHours())
        .padStart(2, "0");

    const mm =
        String(now.getMinutes())
        .padStart(2, "0");

    const ss =
        String(now.getSeconds())
        .padStart(2, "0");


    const timeString =
        `${hh}:${mm}:${ss}`;


    counts[name] =
        (counts[name] || 0) + 1;


    lastWinner =
        name;


    lastWinTime =
        timeString;


    lastHitTimestamps[name] =
        now.getTime();


    history.unshift({

        name: name,

        time: timeString

    });


    if (history.length > 50) {

        history =
            history.slice(0, 50);

    }


    /* Firebaseへ保存 */

    stateRef.set({

        counts: counts,

        history: history,

        lastWinner: lastWinner,

        lastWinTime: lastWinTime,

        lastHitTimestamps:
            lastHitTimestamps,

        spinningText: name

    });


    showWinnerDisplay(
        name,
        timeString
    );


    render();

}


/* ==================================================
   当選表示
================================================== */

function showWinnerDisplay(
    name,
    timeString
) {

    const display =
        document.getElementById(
            "display"
        );


    display.innerText =
        `🎉 当たり！！【 ${name} 】`;


    display.style.color =
        memberColors[name] ||
        "#ff4081";


    const timeEl =
        document.getElementById(
            "win-time-display"
        );


    if (timeString) {

        timeEl.innerText =
            `当選時刻: ${timeString}`;

        timeEl.style.display =
            "block";

    }


    const xLink =
        document.getElementById(
            "x-main-link"
        );


    if (memberXUrls[name]) {

        xLink.href =
            memberXUrls[name];

        xLink.innerText =
            `🔗 ${name} の公式Xを見る ↗`;

        xLink.style.borderColor =
            memberColors[name] ||
            "#e91e63";

    }


    let elapsed = "";


    const hitTime =
        lastHitTimestamps[name];


    if (hitTime) {

        let diff =
            Date.now() - hitTime;


        if (diff < 0) {

            diff = 0;

        }


        const sec =
            Math.floor(diff / 1000);


        const days =
            Math.floor(sec / 86400);


        const hours =
            Math.floor(
                (sec % 86400) / 3600
            );


        const minutes =
            Math.floor(
                (sec % 3600) / 60
            );


        const seconds =
            sec % 60;


        if (days > 0)
            elapsed += `${days}日`;

        if (
            days > 0 ||
            hours > 0
        )
            elapsed += `${hours}時間`;

        if (
            days > 0 ||
            hours > 0 ||
            minutes > 0
        )
            elapsed += `${minutes}分`;

        elapsed += `${seconds}秒ぶり`;

    }


    let shareText =
        `SUPER☆GiRLS 第7章 ガチャ結果✨\n\n` +
        `🎉 【 ${name} 】が当たりました！`;


    if (elapsed) {

        shareText +=
            `\n（前回から ${elapsed}）`;

    }


    shareText +=
        `\n\n#スパガ #SUPERGiRLS`;


    const shareUrl =
        `https://twitter.com/intent/tweet?text=` +
        encodeURIComponent(shareText);


    document.getElementById(
        "x-share-btn"
    ).href =
        shareUrl;


    document.getElementById(
        "action-btn-container"
    ).style.display =
        "flex";

}


/* ==================================================
   表示更新
================================================== */

function render() {

    const now =
        new Date();


    const month =
        now.getMonth() + 1;


    const date =
        now.getDate();


    let html = "";


    members.forEach(name => {

        const color =
            memberColors[name] ||
            "#fff";


        const birthday =
            memberBirthdays[name];


        const isBirthday =
            birthday &&
            birthday.month === month &&
            birthday.day === date;


        const birthdayHtml =
            isBirthday
                ? `<span class="birthday-tag">
                    🎂 Happy Birthday ${name}
                   </span>`
                : "";


        html += `

            <div class="row">

                <div class="member-info">

                    <span
                        class="member-badge"
                        style="background:${color}">
                    </span>

                    <span
                        class="member-name"
                        style="color:${color}">
                        ${name}
                    </span>

                    ${birthdayHtml}

                    <a
                        href="${memberXUrls[name]}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="x-sub-link">
                        X ↗
                    </a>

                </div>

                <span class="count-num">
                    ${counts[name] || 0} 回
                </span>

            </div>
        `;

    });


    document.getElementById(
        "list"
    ).innerHTML =
        html;


    let historyHtml = "";


    if (
        !history ||
        history.length === 0
    ) {

        historyHtml =
            `<div style="
                color:#777;
                text-align:center;
                padding:10px;">
                まだ履歴はありません
             </div>`;

    } else {

        history.forEach(item => {

            const color =
                memberColors[item.name] ||
                "#fff";


            historyHtml += `

                <div class="history-row">

                    <div class="history-member">

                        <span
                            class="history-badge"
                            style="background:${color}">
                        </span>

                        <span
                            style="
                                color:${color};
                                font-weight:bold;">
                            🎉 ${item.name}
                        </span>

                    </div>

                    <span class="history-time">
                        ${item.time}
                    </span>

                </div>
            `;

        });

    }


    document.getElementById(
        "history-list"
    ).innerHTML =
        historyHtml;

}


/* ==================================================
   初期表示
================================================== */

render();


/* ==================================================
   10秒ごとにガチャ
================================================== */

setInterval(
    loop,
    10000
);

</script>

</body>
</html>
