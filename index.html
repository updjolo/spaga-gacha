<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SUPER☆GiRLS 第7章</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #eee;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 20px;
            color: #ddd;
            margin: 0 0 10px 0;
            font-weight: normal;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* 時計エリア */
        #clock-box {
            background: rgba(28, 28, 28, 0.9);
            border: 2px solid #e91e63;
            border-radius: 15px;
            padding: 15px 30px;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
            width: 90%;
            max-width: 500px;
        }
        #date-display {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 5px;
        }
        #birthday-display {
            font-size: 16px;
            font-weight: bold;
            color: #ff80ab;
            margin: 3px 0 6px;
            min-height: 20px;
            text-shadow: 0 1px 4px rgba(255, 64, 129, 0.35);
        }
        #time-display {
            font-size: 45px;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        /* リアルタイムモニター */
        #live-spinning {
            font-size: 14px;
            color: #bbb;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: inline-block;
            font-family: 'Courier New', monospace;
            border: 1px dashed #777;
        }

        #longest-absent {
            margin: 8px 0 12px;
            font-size: 14px;
            color: #ddd;
        }

        /* 当選ステータスコンテナ */
        #win-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
            min-height: 100px;
            justify-content: center;
        }

        #display {
            font-size: 32px;
            font-weight: bold;
            color: #ff4081;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            letter-spacing: 3px;
            transition: color 0.3s ease;
        }

        /* 当選時刻の表示 */
        #win-time-display {
            font-size: 15px;
            color: #ddd;
            margin-bottom: 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            display: none;
        }

        /* 当選時のXリンクボタン表示枠 */
        #x-link-container {
            margin: 15px auto;
            display: none;
        }
        .x-main-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #000;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            border: 2px solid #e91e63;
            border-radius: 25px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.2s, background-color 0.2s, border-color 0.3s, box-shadow 0.3s;
        }
        .x-main-btn:hover {
            transform: scale(1.05);
            background-color: #222;
        }

        /* 共通ボックス */
        .box {
            width: 90%;
            max-width: 500px;
            margin: 15px auto;
            background: rgba(28, 28, 28, 0.9);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            border: 1px solid #555;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        .box h3 {
            margin-top: 0;
            font-size: 18px;
            color: #e91e63;
            border-bottom: 2px solid #555;
            padding-bottom: 8px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
            font-size: 16px;
        }
        .row:last-child { border-bottom: none; }
        
        .member-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .member-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(255,255,255,0.3);
        }

        .member-name {
            font-weight: bold;
        }

        .x-sub-link {
            color: #1da1f2;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #1da1f2;
            padding: 2px 8px;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .x-sub-link:hover {
            background-color: #1da1f2;
            color: #fff;
        }

        .count-num { 
            color: #e91e63; 
            font-weight: bold; 
            font-size: 18px;
        }

        #history-list {
            max-height: 220px;
            overflow-y: auto;
            font-size: 14px;
        }
        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px dashed #444;
            color: #ccc;
        }
        .history-row:last-child { border-bottom: none; }

        .history-member {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .history-time {
            color: #aaa;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #666;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #888; }
    </style>
</head>
<body>

    <h1>SUPER☆GiRLS 第7章</h1>

    <div id="clock-box">
        <div id="date-display">現在時刻を取得中...</div>
        <div id="birthday-display"></div>
        <div id="time-display">--:--:--</div>
    </div>

    <div>
        <span id="live-spinning">ガチャ回転中: リール抽選中...</span>
    </div>

    <div id="longest-absent"></div>

    <div id="win-container">
        <div id="display">ガチャ起動中...（リールが揃うのを待っています）</div>
    </div>
    
    <div id="win-time-display"></div>

    <div id="x-link-container">
        <a id="x-main-link" class="x-main-btn" href="" target="_blank" rel="noopener noreferrer">
            🔗 メンバーの公式Xを見る ↗
        </a>
    </div>

    <div class="box">
        <h3>📊 当選回数カウンター</h3>
        <div id="list"></div>
    </div>

    <div class="box">
        <h3>📜 当選履歴（直近50件）</h3>
        <div id="history-list"></div>
        <button onclick="resetAll()">すべてリセット</button>
    </div>

    <!-- Firebase SDKの読み込み（Module形式） -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCurJ0xKJLE-Z9GGEWcN-R3f5aAmX0FWmI",
            authDomain: "spaga-gacha.firebaseapp.com",
            projectId: "spaga-gacha",
            storageBucket: "spaga-gacha.firebasestorage.app",
            messagingSenderId: "53575541764",
            appId: "1:53575541764:web:128b89f7b7bbd91c4d0151",
            measurementId: "G-J5D2PDVF1Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const members = ["門林有羽", "竹内ななみ", "鎌田彩樺", "柏綾菜", "河村果歩", "櫻井穂夏", "浜田萌帆", "二宮伶寧"];

        const memberColors = {
            "浜田萌帆": "#ff69b4",
            "二宮伶寧": "#a3e635",
            "櫻井穂夏": "#22c55e",
            "柏綾菜":   "#c084fc",
            "河村果歩": "#e2e8f0",
            "門林有羽": "#38bdf8",
            "竹内ななみ": "#ef4444",
            "鎌田彩樺": "#5c6bc0"
        };

        const memberXUrls = {
            "門林有羽": "https://x.com/SG4_YUU",
            "竹内ななみ": "https://x.com/SG5_nanami",
            "鎌田彩樺": "https://x.com/SG6_AYAKA_avex",
            "柏綾菜": "https://x.com/SG6_AYANA_avex",
            "河村果歩": "https://x.com/SG6_KAHO_avex",
            "櫻井穂夏": "https://x.com/SG6_HONOKA_avex",
            "浜田萌帆": "https://x.com/SG7_MOYUHO",
            "二宮伶寧": "https://x.com/SG7_RUNE"
        };

        const memberBirthdays = {
            "門林有羽": "10/28",
            "竹内ななみ": "10/02",
            "鎌田彩樺": "04/29",
            "柏綾菜": "07/20",
            "河村果歩": "06/17",
            "櫻井穂夏": "07/06",
            "浜田萌帆": "10/29",
            "二宮伶寧": "09/16"
        };

        const reel1 = ["門", "竹", "鎌", "柏", "河", "櫻", "浜", "二"];
        const reel2 = ["林", "内", "田", "綾", "村", "井", "宮", "田"];
        const reel3 = ["有", "な", "彩", "菜", "果", "穂", "萌", "伶"];
        const reel4 = ["羽", "な", "樺", "歩", "夏", "帆", "寧"];
        const reel5 = ["み"];

        let counts = {};
        let history = [];
        let lastWinner = "";
        let lastWinTime = "";
        let lastWinTimestamps = {};

        members.forEach(m => { counts[m] = 0; });

        // Firebaseからリアルタイムでデータを同期・取得
        onValue(ref(db, 'gacha_state_v28'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.counts) {
                    members.forEach(m => {
                        counts[m] = data.counts[m] !== undefined ? data.counts[m] : 0;
                    });
                }
                history = data.history || [];
                lastWinner = data.lastWinner || "";
                lastWinTime = data.lastWinTime || "";
                lastWinTimestamps = data.lastWinTimestamps || {};

                if (lastWinner && members.includes(lastWinner)) {
                    showWinnerDisplay(lastWinner, lastWinTime);
                }
                render();
                updateLongestAbsent();
            }
        });

        function updateClock() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const day = ['日', '月', '火', '水', '木', '金', '土'][now.getDay()];
            document.getElementById('date-display').innerText = `${y}年${m}月${d}日 (${day})`;

            const todayBirthday = Object.entries(memberBirthdays)
                .filter(([name, md]) => md === `${m}/${d}`)
                .map(([name]) => name);
            document.getElementById('birthday-display').innerText =
                todayBirthday.length ? `🎂 Happy Birthday ${todayBirthday.join(' & ')}` : '';

            updateLongestAbsent();

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time-display').innerText = `${hh}:${mm}:${ss}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function showWinnerDisplay(name, timeString) {
            const displayEl = document.getElementById("display");

            displayEl.innerText = `🎉 当たり！！【 ${name} 】`;
            displayEl.style.color = memberColors[name] || "#ff4081";

            if (timeString) {
                let timeEl = document.getElementById("win-time-display");
                timeEl.innerText = `当選時刻: ${timeString}`;
                timeEl.style.display = "block";
            }

            if (memberXUrls[name]) {
                const xLinkEl = document.getElementById("x-main-link");
                xLinkEl.href = memberXUrls[name];
                xLinkEl.innerText = `🔗 ${name} の公式Xを見る ↗`;
                xLinkEl.style.borderColor = memberColors[name] || "#e91e63";
                xLinkEl.style.boxShadow = `0 4px 15px ${memberColors[name]}66`;
                document.getElementById("x-link-container").style.display = "block";
            }
        }

        function formatElapsed(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${days}日 ${hours}時間 ${minutes}分 ${seconds}秒`;
        }

        function updateLongestAbsent() {
            const now = Date.now();
            let target = null;
            let longestMs = -1;

            members.forEach(name => {
                const ts = lastWinTimestamps[name];
                if (ts) {
                    const elapsed = now - ts;
                    if (elapsed > longestMs) {
                        longestMs = elapsed;
                        target = name;
                    }
                }
            });

            const el = document.getElementById('longest-absent');
            if (!el) return;

            if (!target) {
                el.innerText = '⏳ 一番出ていないメンバー：まだ当選記録がありません';
                el.style.color = '#ddd';
                return;
            }

            el.innerText = `⏳ 一番出ていないメンバー：${target}（${formatElapsed(longestMs)}ぶり）`;
            el.style.color = memberColors[target] || '#ddd';
        }

        function render() {
            let html = "";
            members.forEach(m => {
                let xUrl = memberXUrls[m] || "#";
                let color = memberColors[m] || "#ffffff";
                html += `
                    <div class="row">
                        <div class="member-info">
                            <span class="member-badge" style="background-color: ${color};"></span>
                            <span class="member-name" style="color: ${color};">${m}</span>
                            <a href="${xUrl}" target="_blank" rel="noopener noreferrer" class="x-sub-link">X ↗</a>
                        </div>
                        <span class="count-num">${counts[m] || 0} 回</span>
                    </div>
                `;
            });
            document.getElementById("list").innerHTML = html;

            let historyHtml = "";
            if (!history || history.length === 0) {
                historyHtml = `<div style="color:#777; text-align:center; padding:10px;">まだ履歴はありません</div>`;
            } else {
                history.forEach(item => {
                    let color = memberColors[item.name] || "#ffffff";
                    historyHtml += `
                        <div class="history-row">
                            <div class="history-member">
                                <span class="history-badge" style="background-color: ${color};"></span>
                                <span style="color: ${color}; font-weight: bold;">🎉 ${item.name}</span>
                            </div>
                            <span class="history-time">${item.time}</span>
                        </div>
                    `;
                });
            }
            document.getElementById("history-list").innerHTML = historyHtml;
        }

        function loop() {
            const r1 = reel1[Math.floor(Math.random() * reel1.length)];
            const r2 = reel2[Math.floor(Math.random() * reel2.length)];
            const r3 = reel3[Math.floor(Math.random() * reel3.length)];
            const r4 = reel4[Math.floor(Math.random() * reel4.length)];
            const r5 = reel5[Math.floor(Math.random() * reel5.length)];

            const combinedName = r1 + r2 + r3 + r4 + r5;
            document.getElementById("live-spinning").innerText = `ガチャ回転中: [ ${r1} | ${r2} | ${r3} | ${r4} | ${r5} ]`;

            if (members.includes(combinedName)) {
                const name = combinedName;
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                const timeString = `${hh}:${mm}:${ss}`;

                showWinnerDisplay(name, timeString);

                counts[name] = (counts[name] || 0) + 1;
                lastWinner = name;
                lastWinTime = timeString;
                lastWinTimestamps[name] = now.getTime();

                history.unshift({ name: name, time: timeString });
                if (history.length > 50) {
                    history.pop();
                }
                
                // Firebaseへデータを保存（自動で全クライアントに同期されます）
                set(ref(db, 'gacha_state_v28'), {
                    counts: counts,
                    history: history,
                    lastWinner: lastWinner,
                    lastWinTime: lastWinTime,
                    lastWinTimestamps: lastWinTimestamps
                });
            }
        }

        window.resetAll = function() {
            if (confirm("カウントと履歴をすべてリセットしますか？")) {
                members.forEach(m => counts[m] = 0);
                history = [];
                lastWinner = "";
                lastWinTime = "";
                lastWinTimestamps = {};
                
                set(ref(db, 'gacha_state_v28'), {
                    counts: counts,
                    history: history,
                    lastWinner: lastWinner,
                    lastWinTime: lastWinTime,
                    lastWinTimestamps: lastWinTimestamps
                });

                document.getElementById("x-link-container").style.display = "none";
                document.getElementById("win-time-display").style.display = "none";
                
                const displayEl = document.getElementById("display");
                displayEl.innerText = "ガチャ起動中...（リールが揃うのを待っています）";
                displayEl.style.color = "#ff4081";
                
                render();
                updateLongestAbsent();
            }
        }

        setInterval(loop, 100);
    </script>
</body>
</html>
