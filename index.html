function updateClock() {

    const now = new Date();

    const year = now.getFullYear();

    const month = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const date = String(
        now.getDate()
    ).padStart(2, "0");

    const dayNames = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
    ];

    const day =
        dayNames[now.getDay()];


    /* -------------------------
       誕生日
       ------------------------- */

    let birthdayText = "";

    members.forEach(function(member) {

        const birthday =
            memberBirthdays[member];

        if (
            birthday &&
            birthday.month === now.getMonth() + 1 &&
            birthday.day === now.getDate()
        ) {

    });


    document.getElementById(
        "date-display"

    const hours =
        String(now.getHours()).padStart(2, "0");

    const minutes =
        String(now.getMinutes()).padStart(2, "0");

    const seconds =
        String(now.getSeconds()).padStart(2, "0");

    updateSinceTargetDisplay(
        now.getTime()

    updateRarestDisplay(
        now.getTime()

}

/* =========================================================
   9月13日カウントダウン
   ========================================================= */

function updateSinceTargetDisplay(
    currentTimestamp
) {

    const target =
        new Date(
            2026,
            8,
            13,
            0,
            0,
            0
        ).getTime();


    const diff =
        target - currentTimestamp;


    const element =
        document.getElementById(
            "since-target-info"
        );


    if (diff <= 0) {

        element.innerText =
            "2026年9月13日を迎えました！";

        return;

    }


    const totalSeconds =
        Math.floor(diff / 1000);


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    element.innerHTML =
        `<span style="color:#ff4081">
            ${days}日
        </span>
        ${hours}時間
        ${minutes}分
        ${seconds}秒`;

}


/* =========================================================
   経過時間を文字列にする
   ========================================================= */

function formatElapsed(
    milliseconds
) {

    if (!milliseconds || milliseconds < 0) {

        return "0秒";

    }


    const totalSeconds =
        Math.floor(
            milliseconds / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    let result = "";


    if (days > 0) {

        result += `${days}日`;

    }


    if (
        days > 0 ||
        hours > 0
    ) {

        result += `${hours}時間`;

    }


    if (
        days > 0 ||
        hours > 0 ||
        minutes > 0
    ) {

        result += `${minutes}分`;

    }


    result += `${seconds}秒`;


    return result;

}


/* =========================================================
   最も出ていないメンバー
   ========================================================= */

function updateRarestDisplay(
    currentTimestamp
) {

    let rarestMember = null;

    let oldestTime = Infinity;


    members.forEach(function(member) {

        let hitTime =
            Number(
                lastHitTimestamps[member] || 0
            );


        /*
         * 一度も当たっていない場合は
         * 0として最優先
         */

        if (hitTime === 0) {

            if (oldestTime !== 0) {

                oldestTime = 0;

                rarestMember = member;

            }

            return;

        }


        if (
            hitTime < oldestTime &&
            oldestTime !== 0
        ) {

            oldestTime = hitTime;

            rarestMember = member;

        }

    });


    const element =
        document.getElementById(
            "rarest-info"
        );


    if (!rarestMember) {

        element.innerText =
            "データなし";

        return;

    }


    /* 一度も当たっていない */

    if (oldestTime === 0) {

        element.innerHTML =
            `<span style="color:${memberColors[rarestMember]}">
                ${rarestMember}
            </span>
            （まだ一度も出ていません）`;

        return;

    }


    const elapsed =
        formatElapsed(
            currentTimestamp - oldestTime
        );


    element.innerHTML =
        `<span style="color:${memberColors[rarestMember]}">
            ${rarestMember}
        </span>
        ―― 最後に当たってから
        <span style="color:#ff4081">
            ${elapsed}
        </span>
        ぶり`;

}

function getRandomLength() {

    const rand =
        Math.random();


    if (rand < 1 / 8) {

        return 3;

    }


    if (rand < 7 / 8) {

        return 4;

    }


    return 5;

}

/* =========================================================
   当たり判定
   ========================================================= */

function isWinner(
    name
) {

    return members.includes(name);

}


/* =========================================================
   当選処理
   ========================================================= */

function processWinner(
    name
) {

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const seconds =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    const timeString =
        `${hours}:${minutes}:${seconds}`;


    /*
     * 当選回数
     */

    counts[name] =
        Number(counts[name] || 0) + 1;


    /*
     * 最終当選時刻
     */

    lastHitTimestamps[name] =
        now.getTime();


    /*
     * 履歴
     */

    history.unshift({

        name: name,

        time: timeString

    });


    /*
     * 最大50件
     */

    if (
        history.length > 50
    ) {

        history =
            history.slice(0, 50);

    }


    /*
     * 最後の当たり
     */

    lastWinner =
        name;

    lastWinTime =
        timeString;


    /*
     * Firebaseに保存
     *
     * ここは gacha_state の中
     */

    if (db) {

        db.ref("gacha_state").update({

            counts: counts,

            history: history,

            lastHitTimestamps:
                lastHitTimestamps,

            lastWinner:
                lastWinner,

            lastWinTime:
                lastWinTime

        }).catch(function(error) {

            console.error(
                "Firebase保存エラー:",
                error
            );

        });

    }


    /*
     * 画面表示
     */

    showWinnerDisplay(
        name,
        timeString
    );


    render();

}


/* =========================================================
   10秒ごとのガチャ
   ========================================================= */

function spinGacha() {

    const name =
        generateRandomName();


    /*
     * ハズレの場合
     */

    if (!isWinner(name)) {

        /*
         * 小さく表示
         *
         * 当たり表示は変更しない
         */

        showMissDisplay(name);

        return;

    }


    /*
     * 当たり
     */

    processWinner(name);

}


/* =========================================================
   画面描画
   ========================================================= */

function render() {

    const now =
        new Date();


    const currentMonth =
        now.getMonth() + 1;


    const currentDate =
        now.getDate();


    let html = "";


    members.forEach(function(member) {

        const color =
            memberColors[member] ||
            "#ffffff";


        const xUrl =
            memberXUrls[member] ||
            "#";


        const birthday =
            memberBirthdays[member];


        const isBirthday =
            birthday &&
            birthday.month === currentMonth &&
            birthday.day === currentDate;


        const birthdayHtml =
            isBirthday
                ? `<span class="birthday-tag">
                     🎂 Happy Birthday ${member}
                   </span>`
                : "";


        html += `

            <div class="row">

                <div class="member-info">

                    <span
                        class="member-badge"
                        style="background-color:${color};"
                    ></span>

                    <span
                        class="member-name"
                        style="color:${color};"
                    >
                        ${member}
                    </span>

                    ${birthdayHtml}

                    <a
                        href="${xUrl}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="x-sub-link"
                    >
                        X ↗
                    </a>

                </div>

                <span class="count-num">
                    ${Number(counts[member] || 0)} 回
                </span>

            </div>

        `;

    });


    document.getElementById(
        "list"
    ).innerHTML = html;


    /* --------------------------------
       履歴
       -------------------------------- */

    let historyHtml = "";


    if (
        !history ||
        history.length === 0
    ) {

        historyHtml =
            `<div
                style="
                    color:#777;
                    text-align:center;
                    padding:10px;
                "
            >
                まだ履歴はありません
            </div>`;

    } else {

        history.forEach(function(item) {

            const color =
                memberColors[item.name] ||
                "#ffffff";


            historyHtml += `

                <div class="history-row">

                    <div class="history-member">

                        <span
                            class="history-badge"
                            style="background-color:${color};"
                        ></span>

                        <span
                            style="
                                color:${color};
                                font-weight:bold;
                            "
                        >
                            🎉 ${item.name}
                        </span>

                    </div>

                    <span class="history-time">
                        ${item.time}
                    </span>

                </div>

            `;

        });

    }


    document.getElementById(
        "history-list"
    ).innerHTML =
        historyHtml;

}


/* =========================================================
   Firebaseからデータを読み込む
   ========================================================= */

if (db) {

    const stateRef =
        db.ref("gacha_state");


    /*
     * ここが重要。
     *
     * Compat版Firebaseなので
     *
     * .on("value", ...)
     *
     * が正しく動きます。
     */

    stateRef.on(
        "value",

        function(snapshot) {

            const data =
                snapshot.val();


            console.log(
                "Firebaseデータ:",
                data
            );


            if (!data) {

                console.log(
                    "gacha_stateがまだありません"
                );


                document.getElementById(
                    "connection-status"
                ).innerText =
                    "🟢 サーバー接続済み";


                document.getElementById(
                    "connection-status"
                ).className =
                    "connected";


                render();

                return;

            }


            /*
             * counts
             */

            if (
                data.counts &&
                typeof data.counts === "object"
            ) {

                counts =
                    data.counts;

            }


            /*
             * 全メンバーを保証
             */

            members.forEach(function(member) {

                if (
                    counts[member] === undefined
                ) {

                    counts[member] = 0;

                }

            });


            /*
             * history
             */

            if (
                Array.isArray(data.history)
            ) {

                history =
                    data.history;

            }


            /*
             * 最後の当選者
             */

            lastWinner =
                data.lastWinner ||
                "";


            /*
             * 最後の当選時刻
             */

            lastWinTime =
                data.lastWinTime ||
                "";


            /*
             * 最終当選タイムスタンプ
             */

            if (
                data.lastHitTimestamps &&
                typeof data.lastHitTimestamps === "object"
            ) {

                lastHitTimestamps =
                    data.lastHitTimestamps;

            }


            /*
             * 全メンバーを保証
             */

            members.forEach(function(member) {

                if (
                    lastHitTimestamps[member] === undefined
                ) {

                    lastHitTimestamps[member] = 0;

                }

            });


            /*
             * Firebase接続済み
             */

            const status =
                document.getElementById(
                    "connection-status"
                );


            status.innerText =
                "🟢 サーバー接続済み";


            status.className =
                "connected";


            /*
             * 最後の当たりを表示
             *
             * ハズレでは消さない
             */

            if (
                lastWinner &&
                members.includes(lastWinner)
            ) {

                showWinnerDisplay(
                    lastWinner,
                    lastWinTime
                );

            }


            /*
             * 画面更新
             */

            render();


            /*
             * 最も出ていないメンバーを即時計算
             */

            updateRarestDisplay(
                Date.now()
            );

        },


        function(error) {

            console.error(
                "Firebase読み込みエラー:",
                error
            );


            const status =
                document.getElementById(
                    "connection-status"
                );


            status.innerText =
                "🔴 Firebase接続エラー";


            status.className =
                "disconnected";


            /*
             * エラーでも時計は動かす
             */

            render();

        }

    );


    /*
     * Firebase接続状態
     */

    db.ref(".info/connected").on(
        "value",

        function(snapshot) {

            const status =
                document.getElementById(
                    "connection-status"
                );


            if (
                snapshot.val() === true
            ) {

                status.innerText =
                    "🟢 サーバー接続済み";

                status.className =
                    "connected";

            } else {

                status.innerText =
                    "🟡 サーバー接続待機中...";

                status.className =
                    "";

            }

        }

    );

}


/* =========================================================
   初期描画
   ========================================================= */

render();


/* =========================================================
   10秒ごとにガチャ
   ========================================================= */

/*
 * ページを開いた瞬間には回さず、
 * 10秒後から開始。
 */

setInterval(
    spinGacha,
    10000
);


/*
 * 最初のハズレ表示用
 *
 * 起動直後にもランダムな文字を表示
 */

showMissDisplay(
    generateRandomName()
);

</script>

</body>
</html>
