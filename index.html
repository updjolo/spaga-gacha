/* =========================================================
   ガチャ設定
========================================================= */

/*
 * 1分に1回ガチャを判定する。
 *
 * HIT_CHANCE = 1/60
 *
 * 1回の判定で当たる確率は約1.67%。
 *
 * 1時間あたり平均1回程度になる設定。
 *
 * 「平均」なので、
 * 1時間ぴったりに1回ではない。
 */

const HIT_CHANCE =
    1 / 60;


/*
 * ガチャ判定間隔
 *
 * 60秒
 */

const GACHA_INTERVAL =
    60 * 1000;


/* =========================================================
   ローカル状態
========================================================= */

let counts = {};

let history = [];

let lastWinner = "";

let lastWinTime = "";

let lastHitTimestamps = {};


/*
 * 初期値
 */

members.forEach(member => {

    counts[member] = 0;

});


/* =========================================================
   ハズレ用リール
========================================================= */

const missReel1 = [

    "門",
    "竹",
    "鎌",
    "柏",
    "河",
    "櫻",
    "浜",
    "二"

];


const missReel2 = [

    "林",
    "内",
    "田",
    "綾",
    "村",
    "井",
    "宮",
    "宮"

];


const missReel3 = [

    "有",
    "な",
    "彩",
    "菜",
    "果",
    "穂",
    "萌",
    "伶"

];


const missReel4 = [

    "羽",
    "な",
    "樺",
    "歩",
    "夏",
    "帆",
    "寧"

];


const missReel5 = [

    "み"

];


/* =========================================================
   疑似乱数
========================================================= */

function seededRandom(seed) {

    let x =
        Math.sin(seed) * 10000;

    return x - Math.floor(x);

}


/* =========================================================
   全端末共通ハズレ
========================================================= */

function getSynchronizedMissName() {

    /*
     * 現在の1分ブロック
     */

    const timeBlock =
        Math.floor(Date.now() / GACHA_INTERVAL);


    const r1 =
        seededRandom(
            timeBlock + 111
        );


    const r2 =
        seededRandom(
            timeBlock + 222
        );


    const r3 =
        seededRandom(
            timeBlock + 333
        );


    const r4 =
        seededRandom(
            timeBlock + 444
        );


    const lengthRandom =
        seededRandom(
            timeBlock + 999
        );


    let length;


    if (lengthRandom < 1 / 8) {

        length = 3;

    }

    else if (lengthRandom < 7 / 8) {

        length = 4;

    }

    else {

        length = 5;

    }


    let name = "";


    name +=
        missReel1[
            Math.floor(
                r1 * missReel1.length
            )
        ];


    name +=
        missReel2[
            Math.floor(
                r2 * missReel2.length
            )
        ];


    name +=
        missReel3[
            Math.floor(
                r3 * missReel3.length
            )
        ];


    if (length >= 4) {

        name +=
            missReel4[
                Math.floor(
                    r4 * missReel4.length
                )
            ];

    }


    if (length === 5) {

        name += "み";

    }


    return name;

}

setInterval(

/* =========================================================
   Firebaseデータ読み込み
========================================================= */

stateRef.on(

    snapshot => {

            if (

            ) {

            }

        });


        /*
         * history
         */

        history =
            data.history || [];

         */

        lastWinner =
            data.lastWinner || "";


        /*
         * lastWinTime
         */

        lastWinTime =
            data.lastWinTime || "";


        /*
         * 最終当選時刻
         */

        lastHitTimestamps =
            data.lastHitTimestamps || {};


        /*
         * もしcountsが全部0で、
         * historyが残っている場合。
         *
         * 過去に誤ってcountsだけ

);


/* =========================================================
   counts復元
========================================================= */

function recoverCountsIfNecessary() {

    /*
     * countsが本当に全部0か調べる
     */

    let allZero = true;


    members.forEach(member => {

        if (
            Number(counts[member] || 0) > 0
        ) {

            allZero = false;

        }

    });


    /*
     * historyがないなら復元不要
     */

    if (
        !allZero ||
        !history ||
        history.length === 0
    ) {

        return;

    }


    /*
     * 履歴から再計算
     */

    const rebuilt = {};


    members.forEach(member => {

        rebuilt[member] = 0;

    });


    if (Array.isArray(history)) {

        history.forEach(item => {

            if (
                item &&
                item.name &&
                members.includes(item.name)
            ) {

                rebuilt[item.name]++;

            }

        });

    }

    else {

        Object.values(history).forEach(item => {

            if (
                item &&
                item.name &&
                members.includes(item.name)
            ) {

                rebuilt[item.name]++;

            }

        });

    }


    /*
     * 1件以上復元できたら
     * Firebaseに保存
     */

    let recovered =
        Object.values(rebuilt)
            .some(value => value > 0);


    if (recovered) {

        counts =
            rebuilt;


        stateRef.child("counts")
            .set(rebuilt);

    }

}


/* =========================================================
   1分ごとのガチャ処理
========================================================= */

/*
 * 重要：
 *
 * 各端末が同じ時間ブロックで
 * 同じガチャを処理する。
 *
 * transactionを使うことで、
 *
 * PC
 * スマホ
 * タブレット
 *
 * の複数端末が同時に開いていても
 *
 * 「同じ1分のガチャを何回も処理」
 *
 * しないようにする。
 */

function processCurrentGacha() {

    const now =
        Date.now();


    /*
     * 現在の1分ブロック
     */

    const block =
        Math.floor(
            now / GACHA_INTERVAL
        );


    const blockRef =
        stateRef
            .child("processedBlocks")
            .child(String(block));


    /*
     * transaction
     *
     * nullなら、この端末が
     * 今回のガチャを処理する。
     *
     * すでに値があれば、
     * 他の端末が処理済み。
     */

    blockRef.transaction(

        current => {

            if (current !== null) {

                return;

            }


            return {

                processedAt:
                    now,

                processed: true

            };

        },

        (error, committed) => {

            if (error) {

                console.error(
                    "ガチャ処理エラー:",
                    error
                );

                return;

            }


            /*
             * 自分が処理権を取れなかった
             */

            if (!committed) {

                return;

            }


            /*
             * 当たり判定
             */

            const random =
                Math.random();


            if (
                random < HIT_CHANCE
            ) {

                executeHit();

            }

        }

    );

}


/* =========================================================
   当たり処理
========================================================= */

function executeHit() {

    /*
     * メンバーをランダム選択
     */

    const index =
        Math.floor(
            Math.random() *
            members.length
        );


    const winner =
        members[index];


    const now =
        new Date();


    const timeString =
        String(now.getHours())
            .padStart(2,"0")
        + ":" +
        String(now.getMinutes())
            .padStart(2,"0")
        + ":" +
        String(now.getSeconds())
            .padStart(2,"0");


    /*
     * 現在のデータを取得
     */

    stateRef.once(
        "value"
    )
    .then(snapshot => {

        const data =
            snapshot.val() || {};


        let newCounts =
            data.counts || {};


        let newHistory =
            data.history || [];


        let newLastHit =
            data.lastHitTimestamps || {};


        /*
         * counts初期化
         */

        members.forEach(member => {

            if (
                newCounts[member] === undefined
            ) {

                newCounts[member] = 0;

            }

        });


        /*
         * 当選回数 +1
         */

        newCounts[winner] =
            Number(
                newCounts[winner] || 0
            ) + 1;


        /*
         * 履歴
         */

        const historyItem = {

            name:
                winner,

            time:
                timeString,

            timestamp:
                Date.now()

        };


        /*
         * 配列の場合
         */

        if (
            Array.isArray(newHistory)
        ) {

            newHistory.push(
                historyItem
            );

        }

        /*
         * オブジェクトの場合
         */

        else {

            newHistory =
                Object.values(
                    newHistory
                );

            newHistory.push(
                historyItem
            );

        }


        /*
         * 履歴は自動削除しない。
         *
         * ここ重要。
         *
         * 以前のように
         * slice(-50) はしない。
         */

        newLastHit[winner] =
            Date.now();


        /*
         * Firebaseへ保存
         */

        return stateRef.update({

            counts:
                newCounts,

            history:
                newHistory,

            lastWinner:
                winner,

            lastWinTime:
                timeString,

            lastHitTimestamps:
                newLastHit

        });

    })
    .catch(error => {

        console.error(
            "当たり保存エラー:",
            error
        );

    });

}


/* =========================================================

function startGachaProcessor() {

    /*
     * ページを開いた瞬間に
     * 現在の1分をチェック
     */

    processCurrentGacha();


    /*
     * 10秒ごとにチェック。
     *
     * 実際の処理は
     * processedBlocksのtransactionによって
     * 1分につき1回だけ。
     */

    setInterval(
        processCurrentGacha,
        10000
    );

}


startGachaProcessor();


/* =========================================================
   時計
========================================================= */

function updateClock() {

    const now =
        new Date();


    const y =
        now.getFullYear();


    const m =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");


    const d =
        String(
            now.getDate()
        ).padStart(2,"0");


    const days = [

        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"

    ];


    document.getElementById(
        "date-display"
    ).innerText =

        `${y}年${m}月${d}日 (${days[now.getDay()]})`;


    const hh =
        String(
            now.getHours()
        ).padStart(2,"0");


    const mm =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const ss =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    document.getElementById(
        "time-display"
    ).innerText =

        `${hh}:${mm}:${ss}`;


    updateSinceTargetDisplay(
        now.getTime()
    );


    updateRarestDisplay(
        now.getTime()
    );

}


setInterval(
    updateClock,
    1000
);


updateClock();


/* =========================================================
   9月13日カウントダウン
========================================================= */

function updateSinceTargetDisplay(
    currentTimestamp
) {

    const target =
        new Date(
            2026,
            8,
            13,
            0,
            0,
            0
        ).getTime();


    const diff =
        target -
        currentTimestamp;


    const element =
        document.getElementById(
            "since-target-info"
        );


    if (diff <= 0) {

        element.innerText =
            "2026年9月13日を迎えました！";

        return;

    }


    const totalSeconds =
        Math.floor(
            diff / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400)
            / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600)
            / 60
        );


    const seconds =
        totalSeconds % 60;


    element.innerHTML =

        `<span style="color:#ff4081">
            ${days}日
        </span>
        ${hours}時間
        ${minutes}分
        ${seconds}秒`;

}


/* =========================================================
   最も出ていないメンバー
========================================================= */

function updateRarestDisplay(
    currentTimestamp
) {

    let rarest = null;

    let oldest =
        Infinity;


    members.forEach(member => {

        let timestamp =
            lastHitTimestamps[member];


        if (
            timestamp === undefined
        ) {

            timestamp = 0;

        }


        if (
            timestamp < oldest
        ) {

            oldest =
                timestamp;

            rarest =
                member;

        }

    });


    const element =
        document.getElementById(
            "rarest-info"
        );


    if (!rarest) {

        element.innerText =
            "データなし";

        return;

    }


    if (oldest === 0) {

        element.innerHTML =

            `<span style="color:${memberColors[rarest]}">
                ${rarest}
            </span>
            （まだ一度も出ていません）`;

        return;

    }


    let diff =
        currentTimestamp -
        oldest;


    if (diff < 0) {

        diff = 0;

    }


    const totalSeconds =
        Math.floor(
            diff / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400)
            / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600)
            / 60
        );


    const seconds =
        totalSeconds % 60;


    let text = "";


    if (days > 0) {

        text +=
            `${days}日`;

    }


    if (
        days > 0 ||
        hours > 0
    ) {

        text +=
            `${hours}時間`;

    }


    if (
        days > 0 ||
        hours > 0 ||
        minutes > 0
    ) {

        text +=
            `${minutes}分`;

    }


    text +=
        `${seconds}秒`;


    element.innerHTML =

        `<span style="color:${memberColors[rarest]}">
            ${rarest}
        </span>
        ―― 最後に当たってから
        <span style="color:#ff4081">
            ${text}
        </span>
        ぶり`;

}


/* =========================================================
   当たり表示
========================================================= */

function showWinnerDisplay(
    name,
    timeString
) {

    const display =
        document.getElementById(
            "display"
        );


    display.innerText =
        `🎉 当たり！！【 ${name} 】`;


    display.style.color =
        memberColors[name]
        || "#ff4081";


    /*
     * 当選時刻
     */

    const timeElement =
        document.getElementById(
            "win-time-display"
        );


    if (timeString) {

        timeElement.innerText =
            `当選時刻: ${timeString}`;

        timeElement.style.display =
            "block";

    }


    /*
     * 公式X
     */

    if (memberXUrls[name]) {

        const xLink =
            document.getElementById(
                "x-main-link"
            );


        xLink.href =
            memberXUrls[name];


        xLink.innerText =
            `🔗 ${name} の公式Xを見る ↗`;


        xLink.style.borderColor =
            memberColors[name]
            || "#e91e63";

    }


    /*
     * Xシェア
     */

    let elapsedText = "";


    const hitTime =
        lastHitTimestamps[name];


    if (hitTime) {

        let diff =
            Date.now() -
            hitTime;


        if (diff < 0) {

            diff = 0;

        }


        const totalSeconds =
            Math.floor(
                diff / 1000
            );


        const days =
            Math.floor(
                totalSeconds / 86400
            );


        const hours =
            Math.floor(
                (totalSeconds % 86400)
                / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600)
                / 60
            );


        const seconds =
            totalSeconds % 60;


        if (days > 0) {

            elapsedText +=
                `${days}日`;

        }


        if (
            days > 0 ||
            hours > 0
        ) {

            elapsedText +=
                `${hours}時間`;

        }


        if (
            days > 0 ||
            hours > 0 ||
            minutes > 0
        ) {

            elapsedText +=
                `${minutes}分`;

        }


        elapsedText +=
            `${seconds}秒ぶり`;

    }


    let shareText =

        `SUPER☆GiRLS 第7章 ガチャ結果✨\n\n` +

        `🎉 【 ${name} 】が当たりました！`;


    if (elapsedText) {

        shareText +=
            `\n（前回から ${elapsedText}）`;

    }


    shareText +=
        `\n\n#スパガ #SUPERGiRLS`;


    const shareUrl =

        `https://twitter.com/intent/tweet?text=` +

        encodeURIComponent(
            shareText
        );


    document.getElementById(
        "x-share-btn"
    ).href =
        shareUrl;


    document.getElementById(
        "action-btn-container"
    ).style.display =
        "flex";

}


/* =========================================================
   当たりがない場合
========================================================= */

function showNoWinner() {

    /*
     * lastWinnerがない場合だけ
     * 初期表示にする。
     *
     * ハズレの文字列は
     * 上の小さい表示だけで出す。
     */

    const display =
        document.getElementById(
            "display"
        );


    /*
     * すでに当たりがある場合は
     * FirebaseのlastWinnerが残るため
     * ここには来ない。
     */

    if (
        !lastWinner
    ) {

        display.innerText =
            "ガチャ起動中...";

        display.style.color =
            "#aaa";

    }


    document.getElementById(
        "win-time-display"
    ).style.display =
        "none";


    document.getElementById(
        "action-btn-container"
    ).style.display =
        "none";

}


/* =========================================================
   画面描画
========================================================= */

function render() {

    const now =
        new Date();


    const month =
        now.getMonth() + 1;


    const date =
        now.getDate();


    let html = "";


    members.forEach(member => {

        const color =
            memberColors[member]
            || "#fff";


        const birthday =
            memberBirthdays[member];


        const isBirthday =

            birthday &&

            birthday.month === month &&

            birthday.day === date;


        const birthdayHTML =

            isBirthday

            ?

            `<span class="birthday-tag">
                🎂 Happy Birthday ${member}
            </span>`

            :

            "";


        html += `

            <div class="row">

                <div class="member-info">

                    <span
                        class="member-badge"
                        style="background-color:${color}">
                    </span>


                    <span
                        class="member-name"
                        style="color:${color}">
                        ${member}
                    </span>


                    ${birthdayHTML}


                    <a
                        href="${memberXUrls[member]}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="x-sub-link">

                        X ↗

                    </a>

                </div>


                <span class="count-num">

                    ${Number(counts[member] || 0)}
                    回

                </span>

            </div>

        `;

    });


    document.getElementById(
        "list"
    ).innerHTML =
        html;


    /*
     * 履歴
     */

    let historyHTML = "";


    if (
        !history ||
        (
            Array.isArray(history)
            &&
            history.length === 0
        )
    ) {

        historyHTML =

            `<div style="
                color:#777;
                text-align:center;
                padding:10px;">

                まだ履歴はありません

            </div>`;

    }

    else {

        let historyArray;


        if (
            Array.isArray(history)
        ) {

            historyArray =
                history;

        }

        else {

            historyArray =
                Object.values(
                    history
                );

        }


        /*
         * 新しい順
         */

        historyArray =
            [...historyArray]
                .reverse();


        historyArray.forEach(item => {

            if (!item) {

                return;

            }


            const color =
                memberColors[item.name]
                || "#fff";


            historyHTML += `

                <div class="history-row">

                    <div class="history-member">

                        <span
                            class="history-badge"
                            style="background-color:${color}">
                        </span>


                        <span
                            style="
                                color:${color};
                                font-weight:bold;">

                            🎉 ${item.name}

                        </span>

                    </div>


                    <span class="history-time">

                        ${item.time || ""}

                    </span>

                </div>

            `;

        });

    }


    document.getElementById(
        "history-list"
    ).innerHTML =
        historyHTML;

}


/* =========================================================
   初期描画
========================================================= */

render();

</script>
