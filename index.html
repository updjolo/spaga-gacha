<script>

/* =========================================================
   Firebase設定
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCurj0xKJLE-Z9GGEWcN-R3f5aAmX0FWmI",

    authDomain: "spaga-gacha.firebaseapp.com",

    measurementId: "G-J5D2PDVF1Y"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* =========================================================
   ガチャ設定
========================================================= */

/*
 * 1分に1回抽選
 */

const GACHA_INTERVAL = 60000;


/*
 * 当たり確率
 *
 * 0.05 = 5%
 * 0.10 = 10%
 * 0.20 = 20%
 *
 * 必要ならここだけ変更。
 */

const HIT_CHANCE = 0.01;


/*
 * 履歴保存数
 *
 * Firebaseには最大200件保存。
 * 画面には直近50件だけ表示。
 */

const MAX_HISTORY = 200;


/* =========================================================
   メンバー
========================================================= */

const members = [

    "門林有羽",
    "竹内ななみ",
    "鎌田彩樺",
    "柏綾菜",
    "河村果歩",
    "櫻井穂夏",
    "浜田萌帆",
    "二宮伶寧"

];


const memberColors = {

    "浜田萌帆": "#ff69b4",

    "二宮伶寧": "#a3e635",

    "櫻井穂夏": "#22c55e",

    "柏綾菜": "#c084fc",

    "河村果歩": "#e2e8f0",

    "門林有羽": "#38bdf8",

    "竹内ななみ": "#ef4444",

    "鎌田彩樺": "#5c6bc0"

};


const memberXUrls = {

    "門林有羽":
        "https://x.com/SG4_YUU",

    "竹内ななみ":
        "https://x.com/SG5_nanami",

    "鎌田彩樺":
        "https://x.com/SG6_AYAKA_avex",

    "柏綾菜":
        "https://x.com/SG6_AYANA_avex",

    "河村果歩":
        "https://x.com/SG6_KAHO_avex",

    "櫻井穂夏":
        "https://x.com/SG6_HONOKA_avex",

    "浜田萌帆":
        "https://x.com/SG7_MOYUHO",

    "二宮伶寧":
        "https://x.com/SG7_RUNE"

};


const memberBirthdays = {

    "門林有羽":
        {month:10, day:28},

    "竹内ななみ":
        {month:10, day:2},

    "鎌田彩樺":
        {month:4, day:29},

    "柏綾菜":
        {month:7, day:20},

    "河村果歩":
        {month:6, day:17},

    "櫻井穂夏":
        {month:7, day:6},

    "浜田萌帆":
        {month:10, day:29},

    "二宮伶寧":
        {month:9, day:16}

};


/* =========================================================
   現在の状態
========================================================= */

let counts = {};

let history = [];

let lastWinner = "";

let lastWinTime = "";

let lastHitTimestamps = {};

let serverOffset = 0;


/*
 * 初期値
 */

members.forEach(member => {

    counts[member] = 0;

});


/* =========================================================
   Firebaseサーバー時刻
========================================================= */

/*
 * Firebaseのサーバーと
 * この端末の時計の差を取得。
 *
 * これによって端末ごとの時計のズレを減らす。
 */

db.ref(".info/serverTimeOffset")
    .on("value", snapshot => {

        serverOffset =
            snapshot.val() || 0;

    });


/*
 * Firebase基準の現在時刻
 */

function getServerTime() {

    return Date.now() + serverOffset;

}


/* =========================================================
   疑似乱数
========================================================= */

function seededRandom(seed) {

    let x =
        Math.sin(seed) * 10000;

    return x - Math.floor(x);

}


/* =========================================================
   1分ごとの共通ハズレ名前
========================================================= */

const missNames = [

    "門林有羽",
    "竹内ななみ",
    "鎌田彩樺",
    "柏綾菜",
    "河村果歩",
    "櫻井穂夏",
    "浜田萌帆",
    "二宮伶寧"

];


/*
 * 全端末で同じハズレ表示
 *
 * 1分単位。
 */

function getSynchronizedMissName() {

    const block =
        Math.floor(
            getServerTime() / GACHA_INTERVAL
        );

    const random =
        seededRandom(
            block + 12345
        );

    const index =
        Math.floor(
            random * missNames.length
        );

    return missNames[index];

}


/* =========================================================
   1分ごとの当選者
========================================================= */

/*
 * 抽選結果も時刻ブロックから
 * 全端末共通で決める。
 *
 * これが重要。
 *
 * A端末とB端末で別々に
 * Math.random()を使わない。
 */

function getWinnerForBlock(block) {

    const hitRandom =
        seededRandom(
            block + 987654
        );


    /*
     * ハズレ
     */

    if (hitRandom >= HIT_CHANCE) {

        return "";

    }


    /*
     * 当たり
     */

    const memberRandom =
        seededRandom(
            block + 543210
        );

    const index =
        Math.floor(
            memberRandom * members.length
        );


    return members[index];

}


/* =========================================================
   時刻をHH:MM:SSにする
========================================================= */

function formatTime(timestamp) {

    const date =
        new Date(timestamp);

    const hh =
        String(date.getHours()).padStart(2,"0");

    const mm =
        String(date.getMinutes()).padStart(2,"0");

    const ss =
        String(date.getSeconds()).padStart(2,"0");

    return `${hh}:${mm}:${ss}`;

}


/* =========================================================
   日付・時刻
========================================================= */

function updateClock() {

    const now =
        new Date(
            getServerTime()
        );


    const y =
        now.getFullYear();

    const m =
        String(
            now.getMonth()+1
        ).padStart(2,"0");

    const d =
        String(
            now.getDate()
        ).padStart(2,"0");


    const days = [

        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"

    ];


    document.getElementById(
        "date-display"
    ).innerText =

        `${y}年${m}月${d}日 (${days[now.getDay()]})`;


    const hh =
        String(
            now.getHours()
        ).padStart(2,"0");

    const mm =
        String(
            now.getMinutes()
        ).padStart(2,"0");

    const ss =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    document.getElementById(
        "time-display"
    ).innerText =

        `${hh}:${mm}:${ss}`;


    updateSinceTargetDisplay(
        now.getTime()
    );


    updateRarestDisplay(
        now.getTime()
    );


    updateMissDisplay();

}


setInterval(
    updateClock,
    1000
);


/* =========================================================
   9月13日カウントダウン
========================================================= */

function updateSinceTargetDisplay(
    currentTimestamp
) {

    const target =

        new Date(
            2026,
            8,
            13,
            0,
            0,
            0
        ).getTime();


    const diff =
        target -
        currentTimestamp;


    const element =
        document.getElementById(
            "since-target-info"
        );


    if (diff <= 0) {

        element.innerText =
            "2026年9月13日を迎えました！";

        return;

    }


    const totalSeconds =
        Math.floor(
            diff / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    element.innerHTML =

        `<span style="color:#ff4081">
            ${days}日
         </span>
         ${hours}時間
         ${minutes}分
         ${seconds}秒`;

}


/* =========================================================
   最も出ていないメンバー
========================================================= */

function updateRarestDisplay(
    currentTimestamp
) {

    let rarest = null;

    let oldest = Infinity;


    members.forEach(member => {

        let timestamp =
            lastHitTimestamps[member];


        if (
            timestamp === undefined ||
            timestamp === null
        ) {

            timestamp = 0;

        }


        if (
            timestamp < oldest
        ) {

            oldest = timestamp;

            rarest = member;

        }

    });


    const element =
        document.getElementById(
            "rarest-info"
        );


    if (!rarest) {

        element.innerText =
            "データなし";

        return;

    }


    if (oldest === 0) {

        element.innerHTML =

            `<span style="color:${memberColors[rarest]}">
                ${rarest}
             </span>
             （まだ一度も出ていません）`;

        return;

    }


    let diff =
        currentTimestamp -
        oldest;


    if (diff < 0) {

        diff = 0;

    }


    const totalSeconds =
        Math.floor(
            diff / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    let text = "";


    if (days > 0) {

        text +=
            `${days}日`;

    }


    if (
        days > 0 ||
        hours > 0
    ) {

        text +=
            `${hours}時間`;

    }


    if (
        days > 0 ||
        hours > 0 ||
        minutes > 0
    ) {

        text +=
            `${minutes}分`;

    }


    text +=
        `${seconds}秒`;


    element.innerHTML =

        `<span style="color:${memberColors[rarest]}">
            ${rarest}
         </span>
         ―― 最後に当たってから
         <span style="color:#ff4081">
            ${text}
         </span>
         ぶり`;

}


/* =========================================================
   ハズレ表示
========================================================= */

function updateMissDisplay() {

    const element =
        document.getElementById(
            "live-spinning"
        );


    element.innerText =

        "ガチャ回転中: " +
        getSynchronizedMissName();

}


/* =========================================================
   当たり表示
========================================================= */

function showWinnerDisplay(
    name,
    timeString
) {

    const display =
        document.getElementById(
            "display"
        );


    display.innerText =
        `🎉 当たり！！【 ${name} 】`;


    display.style.color =
        memberColors[name] ||
        "#ff4081";


    const timeElement =
        document.getElementById(
            "win-time-display"
        );


    if (timeString) {

        timeElement.innerText =
            `当選時刻: ${timeString}`;

        timeElement.style.display =
            "block";

    }


    /*
     * 公式X
     */

    if (memberXUrls[name]) {

        const xLink =
            document.getElementById(
                "x-main-link"
            );


        xLink.href =
            memberXUrls[name];


        xLink.innerText =
            `🔗 ${name} の公式Xを見る ↗`;


        xLink.style.borderColor =
            memberColors[name] ||
            "#e91e63";

    }


    /*
     * Xシェア
     */

    let elapsedText = "";


    const hitTime =
        lastHitTimestamps[name];


    if (hitTime) {

        let diff =
            getServerTime() -
            hitTime;


        if (diff < 0) {

            diff = 0;

        }


        const totalSeconds =
            Math.floor(
                diff / 1000
            );


        const days =
            Math.floor(
                totalSeconds / 86400
            );


        const hours =
            Math.floor(
                (totalSeconds % 86400) / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );


        const seconds =
            totalSeconds % 60;


        if (days > 0)
            elapsedText +=
                `${days}日`;


        if (
            days > 0 ||
            hours > 0
        )
            elapsedText +=
                `${hours}時間`;


        if (
            days > 0 ||
            hours > 0 ||
            minutes > 0
        )
            elapsedText +=
                `${minutes}分`;


        elapsedText +=
            `${seconds}秒ぶり`;

    }


    let shareText =

        `SUPER☆GiRLS 第7章 ガチャ結果✨\n\n` +

        `🎉 【 ${name} 】が当たりました！`;


    if (elapsedText) {

        shareText +=
            `\n（前回から ${elapsedText}）`;

    }


    shareText +=
        `\n\n#スパガ #SUPERGiRLS`;


    const shareUrl =

        `https://twitter.com/intent/tweet?text=` +

        encodeURIComponent(
            shareText
        );


    document.getElementById(
        "x-share-btn"
    ).href = shareUrl;


    document.getElementById(
        "action-btn-container"
    ).style.display = "flex";

}


/* =========================================================
   Firebaseの状態を表示
========================================================= */

function render() {


    /*
     * カウンター
     */

    let html = "";


    members.forEach(member => {

        const color =
            memberColors[member] ||
            "#fff";


        const birthday =
            memberBirthdays[member];


        const now =
            new Date(
                getServerTime()
            );


        const isBirthday =

            birthday &&

            birthday.month ===
                now.getMonth() + 1 &&

            birthday.day ===
                now.getDate();


        const birthdayHTML =

            isBirthday

            ?

            `<span class="birthday-tag">
                🎂 Happy Birthday ${member}
             </span>`

            :

            "";


        html += `

            <div class="row">

                <div class="member-info">

                    <span
                        class="member-badge"
                        style="background-color:${color}">
                    </span>


                    <span
                        class="member-name"
                        style="color:${color}">
                        ${member}
                    </span>


                    ${birthdayHTML}


                    <a
                        href="${memberXUrls[member]}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="x-sub-link">
                        X ↗
                    </a>

                </div>


                <span class="count-num">

                    ${counts[member] || 0} 回

                </span>

            </div>

        `;

    });


    document.getElementById(
        "list"
    ).innerHTML = html;


    /*
     * 履歴
     */

    let historyHTML = "";


    if (
        history.length === 0
    ) {

        historyHTML =

            `<div style="
                color:#777;
                text-align:center;
                padding:10px;">
                まだ履歴はありません
             </div>`;

    } else {


        /*
         * 最新50件だけ表示
         */

        const displayHistory =
            history.slice(0,50);


        displayHistory.forEach(
            item => {

                const color =
                    memberColors[item.name] ||
                    "#fff";


                historyHTML += `

                    <div class="history-row">

                        <div class="history-member">

                            <span
                                class="history-badge"
                                style="background-color:${color}">
                            </span>


                            <span
                                style="
                                    color:${color};
                                    font-weight:bold;">
                                🎉 ${item.name}
                            </span>

                        </div>


                        <span class="history-time">

                            ${item.time}

                        </span>

                    </div>

                `;

            }
        );

    }


    document.getElementById(
        "history-list"
    ).innerHTML =
        historyHTML;

}


/* =========================================================
   ガチャ実行
========================================================= */

/*
 * ここが今回の一番重要なところ。
 *
 * 現在の「1分ブロック」を計算。
 *
 * Firebaseの
 *
 * lastProcessedBlock
 *
 * と比較する。
 *
 * まだ処理されていなければ、
 * transactionで自分だけが処理する。
 *
 * 別端末が同時に実行しても
 * 片方しか成功しない。
 */

function processGacha() {


    const currentTime =
        getServerTime();


    const currentBlock =
        Math.floor(
            currentTime /
            GACHA_INTERVAL
        );


    const stateRef =
        db.ref("gacha_state");


    stateRef.transaction(
        currentState => {


            /*
             * データが存在しない場合
             */

            if (
                currentState === null
            ) {

                currentState = {

                    counts: {},

                    history: [],

                    lastHitTimestamps: {},

                    lastProcessedBlock: -1,

                    lastWinTime: "",

                    lastWinner: "",

                    tick: 0

                };

            }


            /*
             * すでに今の1分を
             * 処理済みなら何もしない。
             */

            if (
                currentState.lastProcessedBlock ===
                currentBlock
            ) {

                return;

            }


            /*
             * カウンターがない場合の初期化
             */

            if (
                !currentState.counts
            ) {

                currentState.counts = {};

            }


            members.forEach(
                member => {

                    if (
                        currentState.counts[member] ===
                        undefined
                    ) {

                        currentState.counts[member] = 0;

                    }

                }
            );


            /*
             * 履歴
             */

            if (
                !Array.isArray(
                    currentState.history
                )
            ) {

                currentState.history = [];

            }


            /*
             * 最終当選時刻
             */

            if (
                !currentState.lastHitTimestamps
            ) {

                currentState.lastHitTimestamps = {};

            }


            /*
             * 今回の当選者を決定
             *
             * 全端末で同じ結果になる。
             */

            const winner =
                getWinnerForBlock(
                    currentBlock
                );


            /*
             * 当たり
             */

            if (winner) {


                /*
                 * カウントアップ
                 */

                currentState.counts[winner]++;


                /*
                 * 当選時刻
                 */

                const hitTimestamp =
                    currentBlock *
                    GACHA_INTERVAL;


                const hitDate =
                    new Date(
                        hitTimestamp
                    );


                const timeString =
                    formatTime(
                        hitTimestamp
                    );


                /*
                 * 最終当選時刻
                 */

                currentState.lastHitTimestamps[winner] =
                    hitTimestamp;


                /*
                 * 最新当選者
                 */

                currentState.lastWinner =
                    winner;


                currentState.lastWinTime =
                    timeString;


                /*
                 * 履歴に追加
                 */

                currentState.history.unshift({

                    name: winner,

                    time: timeString,

                    timestamp: hitTimestamp

                });


                /*
                 * 履歴を最大200件にする
                 *
                 * 古い履歴だけ削除。
                 *
                 * countsには影響なし。
                 */

                currentState.history =
                    currentState.history.slice(
                        0,
                        MAX_HISTORY
                    );

            }


            /*
             * この1分は処理済み
             */

            currentState.lastProcessedBlock =
                currentBlock;


            /*
             * tick
             */

            currentState.tick =
                (currentState.tick || 0) + 1;


            /*
             * Firebaseへ保存
             */

            return currentState;

        },

        (error, committed, snapshot) => {


            if (error) {

                console.error(
                    "ガチャ処理エラー:",
                    error
                );

                return;

            }


            if (committed) {

                console.log(
                    "この端末が今回の1分を処理しました"
                );

            }

        }

    );

}


/* =========================================================
   Firebaseリアルタイム監視
========================================================= */

db.ref("gacha_state")
    .on(
        "value",
        snapshot => {


            const data =
                snapshot.val();


            if (!data) {

                document.getElementById(
                    "connection-status"
                ).innerText =
                    "🟡 ガチャデータ準備中...";

                return;

            }


            /*
             * データ読み込み
             */

            counts =
                data.counts || {};


            history =
                Array.isArray(
                    data.history
                )
                ?
                data.history
                :
                [];


            lastWinner =
                data.lastWinner || "";


            lastWinTime =
                data.lastWinTime || "";


            lastHitTimestamps =
                data.lastHitTimestamps || {};


            /*
             * メンバーが存在しない場合は0
             */

            members.forEach(
                member => {

                    if (
                        counts[member] ===
                        undefined
                    ) {

                        counts[member] = 0;

                    }

                }
            );


            /*
             * 当たり表示
             *
             * Firebaseに保存されている
             * 最新当たりを表示。
             *
             * 次の当たりが出るまで
             * ずっと表示される。
             */

            if (
                lastWinner &&
                members.includes(
                    lastWinner
                )
            ) {

                showWinnerDisplay(
                    lastWinner,
                    lastWinTime
                );

            } else {

                document.getElementById(
                    "display"
                ).innerText =
                    "ガチャ回転中...";

            }


            /*
             * 画面更新
             */

            render();


            updateRarestDisplay(
                getServerTime()
            );


            /*
             * ハズレ表示
             */

            updateMissDisplay();


            /*
             * 接続済み
             */

            document.getElementById(
                "connection-status"
            ).innerText =
                "🟢 サーバー接続済み";

        },

        error => {

            console.error(
                "Firebase接続エラー:",
                error
            );


            document.getElementById(
                "connection-status"
            ).innerText =
                "🔴 Firebase接続エラー";

        }

    );


/* =========================================================
   Firebase接続状態
========================================================= */

db.ref(".info/connected")
    .on(
        "value",
        snapshot => {

            const connected =
                snapshot.val();


            if (connected) {

                document.getElementById(
                    "connection-status"
                ).innerText =
                    "🟢 サーバー接続済み";

            } else {

                document.getElementById(
                    "connection-status"
                ).innerText =
                    "🟡 Firebase接続待機中...";

            }

        }
    );


/* =========================================================
   1分ごとのガチャチェック
========================================================= */

/*
 * 1秒ごとにチェックする。
 *
 * 実際の抽選は
 * lastProcessedBlockによって
 * 1分に1回だけ。
 *
 * 例えば
 *
 * 02:30:59
 *  ↓
 * 02:31:00
 *
 * になった瞬間、
 * どこかの端末が処理する。
 *
 * 複数端末が同時に処理しても
 * transactionで1回だけになる。
 */

setInterval(
    processGacha,
    1000
);


/*
 * ページを開いた瞬間にもチェック
 */

processGacha();


/* =========================================================
   初期表示
========================================================= */

updateClock();

updateMissDisplay();

render();

</script>
