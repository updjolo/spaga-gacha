        /* ボタン */
        #action-btn-container {

            gap: 12px;

            width: 90%;
            max-width: 500px;

        .action-btn {

        /* 共通ボックス */
        .box {

            max-width: 500px;
            margin: 15px auto;

            padding: 20px;

            color: #fff;

        @keyframes pulse {
            0% {

            }

        .x-sub-link {

            text-decoration: none;

        .x-sub-link:hover {

        .count-num {

        #history-list {

        .history-row {

        .history-member {

        .history-time {
            color: #aaa;

            font-size: 13px;
            white-space: nowrap;
        }

        /* スマホ */
        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            #time-display {
                font-size: 36px;
            }

            #display {
                font-size: 24px;
            }

            .row {
                font-size: 14px;
            }

            .member-info {
                gap: 7px;
            }
        }

    <script>

        // ============================================================
        // Firebase設定
        // ============================================================

        const firebaseConfig = {

            apiKey: "AIzaSyCurJ0xKJLE-Z9GGEWcN-R3f5aAmX0FWmI",

            authDomain: "spaga-gacha.firebaseapp.com",

            databaseURL:
                "https://spaga-gacha-default-rtdb.firebaseio.com",

            projectId: "spaga-gacha",

            storageBucket:
                "spaga-gacha.firebasestorage.app",

            messagingSenderId: "53575541764",

            appId:
                "1:53575541764:web:128b89f7b7bbd91c4d0151",

            measurementId:
                "G-J5D2PDVF1Y"
        };


        // Firebase開始
        firebase.initializeApp(firebaseConfig);

        // ★ FirestoreではなくRealtime Database
        const db = firebase.database();


        // ============================================================
        // メンバー
        // ============================================================

        const members = [
            "門林有羽",
            "竹内ななみ",
            "鎌田彩樺",
            "柏綾菜",
            "河村果歩",
            "櫻井穂夏",
            "浜田萌帆",
            "二宮伶寧"
        ];


        // ============================================================
        // メンバーカラー
        // ============================================================

        const memberColors = {

            "浜田萌帆": "#ff69b4",

            "二宮伶寧": "#a3e635",

            "櫻井穂夏": "#22c55e",

            "柏綾菜": "#c084fc",

            "河村果歩": "#e2e8f0",

            "門林有羽": "#38bdf8",

            "竹内ななみ": "#ef4444",

            "鎌田彩樺": "#5c6bc0"

        };


        // ============================================================
        // X
        // ============================================================

        const memberXUrls = {

            "門林有羽":
                "https://x.com/SG4_YUU",

            "竹内ななみ":
                "https://x.com/SG5_nanami",

            "鎌田彩樺":
                "https://x.com/SG6_AYAKA_avex",

            "柏綾菜":
                "https://x.com/SG6_AYANA_avex",

            "河村果歩":
                "https://x.com/SG6_KAHO_avex",

            "櫻井穂夏":
                "https://x.com/SG6_HONOKA_avex",

            "浜田萌帆":
                "https://x.com/SG7_MOYUHO",

            "二宮伶寧":
                "https://x.com/SG7_RUNE"

        };


        // ============================================================
        // 誕生日
        // ============================================================

        const memberBirthdays = {

            "門林有羽":
                { month: 10, day: 28 },

            "竹内ななみ":
                { month: 10, day: 2 },

            "鎌田彩樺":
                { month: 4, day: 29 },

            "柏綾菜":
                { month: 7, day: 20 },

            "河村果歩":
                { month: 6, day: 17 },

            "櫻井穂夏":
                { month: 7, day: 6 },

            "浜田萌帆":
                { month: 10, day: 29 },

            "二宮伶寧":
                { month: 9, day: 16 }

        };


        // ============================================================
        // データ
        // ============================================================

        let counts = {};

        let history = [];

        let lastWinner = "";

        let lastWinTime = "";

        let lastHitTimestamps = {};


        // 最初は全員0回
        members.forEach(member => {

            counts[member] = 0;

        });


        // ============================================================
        // Firebase接続状態
        // ============================================================

        const connectionRef =
            db.ref(".info/connected");


        connectionRef.on("value", snapshot => {

            const connected = snapshot.val();

            const status =
                document.getElementById("live-spinning");


            if (connected === true) {

                status.innerText =
                    "🟢 サーバー接続済み";

                status.style.color =
                    "#86efac";

                status.style.borderColor =
                    "#22c55e";

            } else {

                status.innerText =
                    "🟡 サーバー接続待機中...";

                status.style.color =
                    "#fde68a";

                status.style.borderColor =
                    "#eab308";

            }

        });


        // ============================================================
        // ★ ここが一番重要
        //
        // Firebase Realtime Database
        // gacha_state をリアルタイム監視
        // ============================================================

        const gachaRef =
            db.ref("gacha_state");


        gachaRef.on(

            "value",

            snapshot => {

                console.log(
                    "Firebaseからデータを受信:",
                    snapshot.val()
                );


                const data =
                    snapshot.val();


                if (!data) {

                    document.getElementById(
                        "live-spinning"
                    ).innerText =
                        "🟢 Firebase接続済み（データなし）";

                    return;
                }


                // ----------------------------------------------------
                // 当選回数
                // ----------------------------------------------------

                if (data.counts) {

                    counts = data.counts;

                }


                // ----------------------------------------------------
                // 履歴
                // ----------------------------------------------------

                if (data.history) {

                    if (Array.isArray(data.history)) {

                        history =
                            data.history;

                    } else {

                        history =
                            Object.values(data.history);

                    }

                } else {

                    history = [];

                }


                // ----------------------------------------------------
                // 最後の当選者
                // ----------------------------------------------------

                lastWinner =
                    data.lastWinner || "";


                // ----------------------------------------------------
                // 最後の当選時刻
                // ----------------------------------------------------

                lastWinTime =
                    data.lastWinTime || "";


                // ----------------------------------------------------
                // 各メンバーの最後の当選時刻
                // ----------------------------------------------------

                if (data.lastHitTimestamps) {

                    lastHitTimestamps =
                        data.lastHitTimestamps;

                } else {

                    lastHitTimestamps = {};

                }


                // ----------------------------------------------------
                // spinningText
                // ----------------------------------------------------

                if (data.spinningText) {

                    document.getElementById(
                        "live-spinning"
                    ).innerText =
                        `🎰 ガチャ回転中: ${data.spinningText}`;

                }


                // ----------------------------------------------------
                // メンバーが存在しない場合は0
                // ----------------------------------------------------

                members.forEach(member => {

                    if (
                        counts[member] === undefined ||
                        counts[member] === null
                    ) {

                        counts[member] = 0;

                    }

                });


                // ----------------------------------------------------
                // 最終当選者を表示
                // ----------------------------------------------------

                if (
                    lastWinner &&
                    members.includes(lastWinner)
                ) {

                    showWinnerDisplay(
                        lastWinner,
                        lastWinTime
                    );

                }


                // ----------------------------------------------------
                // 画面更新
                // ----------------------------------------------------

                render();

            },


            // --------------------------------------------------------
            // Firebaseエラー
            // --------------------------------------------------------

            error => {

                console.error(
                    "Firebaseエラー:",
                    error
                );


                document.getElementById(
                    "live-spinning"
                ).innerText =
                    "🔴 Firebase接続エラー";


                document.getElementById(
                    "live-spinning"
                ).style.color =
                    "#f87171";

            }

        );


        // ============================================================
        // 時計
        // ============================================================

        function updateClock() {

            const now =
                new Date();


            const y =
                now.getFullYear();


            const m =
                String(
                    now.getMonth() + 1
                ).padStart(2, "0");


            const d =
                String(
                    now.getDate()
                ).padStart(2, "0");


            const days =
                [
                    "日",
                    "月",
                    "火",
                    "水",
                    "木",
                    "金",
                    "土"
                ];


            const day =
                days[now.getDay()];


            document.getElementById(
                "date-display"
            ).innerText =
                `${y}年${m}月${d}日 (${day})`;


            const hh =
                String(
                    now.getHours()
                ).padStart(2, "0");


            const mm =
                String(
                    now.getMinutes()
                ).padStart(2, "0");


            const ss =
                String(
                    now.getSeconds()
                ).padStart(2, "0");


            document.getElementById(
                "time-display"
            ).innerText =
                `${hh}:${mm}:${ss}`;


            updateSinceTargetDisplay(
                now.getTime()
            );


            updateRarestDisplay(
                now.getTime()
            );

        }


        setInterval(
            updateClock,
            1000
        );


        updateClock();


        // ============================================================
        // 9月13日までのカウントダウン
        // ============================================================

        function updateSinceTargetDisplay(
            currentTimestamp
        ) {

            const targetTime =
                new Date(
                    2026,
                    8,
                    13,
                    0,
                    0,
                    0
                ).getTime();


            const diffMs =
                targetTime -
                currentTimestamp;


            const element =
                document.getElementById(
                    "since-target-info"
                );


            if (diffMs <= 0) {

                element.innerText =
                    "2026年9月13日を迎えました！";

                return;

            }


            const diffSec =
                Math.floor(
                    diffMs / 1000
                );


            const days =
                Math.floor(
                    diffSec / 86400
                );


            const hours =
                Math.floor(
                    (diffSec % 86400) / 3600
                );


            const minutes =
                Math.floor(
                    (diffSec % 3600) / 60
                );


            const seconds =
                diffSec % 60;


            element.innerHTML =
                `<span style="color:#ff4081">${days}日</span> ` +
                `${hours}時間 ` +
                `${minutes}分 ` +
                `${seconds}秒`;

        }


        // ============================================================
        // 最も出ていないメンバー
        // ============================================================

        function updateRarestDisplay(
            currentTimestamp
        ) {

            let rarestMember =
                null;


            let oldestTime =
                Infinity;


            members.forEach(member => {

                let hitTime =
                    lastHitTimestamps[member];


                if (
                    hitTime === undefined ||
                    hitTime === null ||
                    hitTime === ""
                ) {

                    hitTime = 0;

                }


                hitTime =
                    Number(hitTime);


                if (
                    hitTime < oldestTime
                ) {

                    oldestTime =
                        hitTime;

                    rarestMember =
                        member;

                }

            });


            const element =
                document.getElementById(
                    "rarest-info"
                );


            if (!rarestMember) {

                element.innerText =
                    "データなし";

                return;

            }


            // 一度も出ていない
            if (oldestTime === 0) {

                element.innerHTML =
                    `<span style="color:${memberColors[rarestMember]}">${rarestMember}</span>` +
                    `（まだ一度も出ていません）`;

                return;

            }


            let diffMs =
                currentTimestamp -
                oldestTime;


            if (diffMs < 0) {

                diffMs = 0;

            }


            const diffSec =
                Math.floor(
                    diffMs / 1000
                );


            const days =
                Math.floor(
                    diffSec / 86400
                );


            const hours =
                Math.floor(
                    (diffSec % 86400) / 3600
                );


            const minutes =
                Math.floor(
                    (diffSec % 3600) / 60
                );


            const seconds =
                diffSec % 60;


            let timeStr = "";


            if (days > 0) {

                timeStr +=
                    `${days}日`;

            }


            if (
                days > 0 ||
                hours > 0
            ) {

                timeStr +=
                    `${hours}時間`;

            }


            if (
                days > 0 ||
                hours > 0 ||
                minutes > 0
            ) {

                timeStr +=
                    `${minutes}分`;

            }


            timeStr +=
                `${seconds}秒`;


            element.innerHTML =
                `<span style="color:${memberColors[rarestMember]}">${rarestMember}</span>` +
                ` ―― 最後に当たってから ` +
                `<span style="color:#ff4081">${timeStr}</span> ぶり`;

        }


        // ============================================================
        // 当選者表示
        // ============================================================

        function showWinnerDisplay(
            name,
            timeString
        ) {

            const display =
                document.getElementById(
                    "display"
                );


            display.innerText =
                `🎉 当たり！！【 ${name} 】`;


            display.style.color =
                memberColors[name] ||
                "#ff4081";


            // 当選時刻
            const timeElement =
                document.getElementById(
                    "win-time-display"
                );


            if (timeString) {

                timeElement.innerText =
                    `当選時刻: ${timeString}`;

                timeElement.style.display =
                    "block";

            }


            // --------------------------------------------------------
            // Xリンク
            // --------------------------------------------------------

            if (memberXUrls[name]) {

                const xLink =
                    document.getElementById(
                        "x-main-link"
                    );


                xLink.href =
                    memberXUrls[name];


                xLink.innerText =
                    `🔗 ${name} の公式Xを見る ↗`;


                xLink.style.borderColor =
                    memberColors[name] ||
                    "#e91e63";


                xLink.style.boxShadow =
                    `0 4px 15px ` +
                    `${memberColors[name] || "#e91e63"}66`;

            }


            // --------------------------------------------------------
            // 前回から何秒ぶりか
            // --------------------------------------------------------

            let elapsedStr = "";


            const hitTime =
                Number(
                    lastHitTimestamps[name]
                );


            if (hitTime > 0) {

                let diffMs =
                    Date.now() -
                    hitTime;


                if (diffMs < 0) {

                    diffMs = 0;

                }


                const diffSec =
                    Math.floor(
                        diffMs / 1000
                    );


                const days =
                    Math.floor(
                        diffSec / 86400
                    );


                const hours =
                    Math.floor(
                        (diffSec % 86400) / 3600
                    );


                const minutes =
                    Math.floor(
                        (diffSec % 3600) / 60
                    );


                const seconds =
                    diffSec % 60;


                if (days > 0) {

                    elapsedStr +=
                        `${days}日`;

                }


                if (
                    days > 0 ||
                    hours > 0
                ) {

                    elapsedStr +=
                        `${hours}時間`;

                }


                if (
                    days > 0 ||
                    hours > 0 ||
                    minutes > 0
                ) {

                    elapsedStr +=
                        `${minutes}分`;

                }


                elapsedStr +=
                    `${seconds}秒ぶり`;

            }


            // --------------------------------------------------------
            // Xシェア
            // --------------------------------------------------------

            let shareText =
                `SUPER☆GiRLS 第7章 ガチャ結果✨\n\n` +
                `🎉 【 ${name} 】が当たりました！`;


            if (elapsedStr) {

                shareText +=
                    `\n（前回から ${elapsedStr}）`;

            }


            shareText +=
                `\n\n#スパガ #SUPERGiRLS`;


            const shareUrl =
                `https://twitter.com/intent/tweet?text=` +
                encodeURIComponent(
                    shareText
                );


            document.getElementById(
                "x-share-btn"
            ).href =
                shareUrl;


            document.getElementById(
                "action-btn-container"
            ).style.display =
                "flex";

        }


        // ============================================================
        // メンバー一覧・履歴を表示
        // ============================================================

        function render() {

            const now =
                new Date();


            const currentMonth =
                now.getMonth() + 1;


            const currentDate =
                now.getDate();


            let html = "";


            members.forEach(member => {

                const color =
                    memberColors[member] ||
                    "#ffffff";


                const xUrl =
                    memberXUrls[member] ||
                    "#";


                const birthday =
                    memberBirthdays[member];


                const isBirthday =
                    birthday &&
                    birthday.month === currentMonth &&
                    birthday.day === currentDate;


                const birthdayHtml =
                    isBirthday
                        ? `<span class="birthday-tag">🎂 Happy Birthday ${member}</span>`
                        : "";


                const count =
                    Number(
                        counts[member]
                    ) || 0;


                html += `

                    <div class="row">

                        <div class="member-info">

                            <span
                                class="member-badge"
                                style="background-color:${color};"
                            ></span>

                            <span
                                class="member-name"
                                style="color:${color};"
                            >
                                ${member}
                            </span>

                            ${birthdayHtml}

                            <a
                                href="${xUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="x-sub-link"
                            >
                                X ↗
                            </a>

                        </div>

                        <span class="count-num">
                            ${count} 回
                        </span>

                    </div>

                `;

            });


            document.getElementById(
                "list"
            ).innerHTML =
                html;


            // ========================================================
            // 履歴
            // ========================================================

            let historyHtml = "";


            if (
                !history ||
                history.length === 0
            ) {

                historyHtml =
                    `<div style="color:#777;text-align:center;padding:10px;">
                        まだ履歴はありません
                    </div>`;

            } else {

                history
                    .slice(0, 50)
                    .forEach(item => {

                        if (!item) {
                            return;
                        }


                        const name =
                            item.name || "不明";


                        const time =
                            item.time || "";


                        const color =
                            memberColors[name] ||
                            "#ffffff";


                        historyHtml += `

                            <div class="history-row">

                                <div class="history-member">

                                    <span
                                        class="history-badge"
                                        style="background-color:${color};"
                                    ></span>

                                    <span
                                        style="
                                            color:${color};
                                            font-weight:bold;
                                        "
                                    >
                                        🎉 ${name}
                                    </span>

                                </div>

                                <span class="history-time">
                                    ${time}
                                </span>

                            </div>

                        `;

                    });

            }


            document.getElementById(
                "history-list"
            ).innerHTML =
                historyHtml;

        }


        // ============================================================
        // 最初の画面
        // ============================================================

        render();

    </script>

</body>
</html>
